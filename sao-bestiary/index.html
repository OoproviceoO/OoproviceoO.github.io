<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>艾恩葛朗特掉落圖鑑</title>
<style>
:root{color-scheme:light;
  --g50:hsl(140 45% 97%);--g100:hsl(140 42% 93%);--g200:hsl(142 36% 86%);--g300:hsl(145 32% 74%);
  --g600:hsl(150 42% 31%);--g700:hsl(152 46% 24%);--g800:hsl(152 44% 18%);--g900:hsl(152 40% 12%);
  --n400:hsl(150 7% 58%);--n500:hsl(150 7% 45%);--n600:hsl(150 8% 36%);
  --y50:hsl(50 100% 97%);--y100:hsl(48 92% 89%);--y700:hsl(36 82% 30%);
  --p100:hsl(275 55% 94%);--p700:hsl(275 38% 40%);
  --k100:hsl(345 75% 94%);--k700:hsl(345 55% 38%);
  --shadow-sm:0 1px 2px hsl(150 30% 20% / .08);
  --shadow:0 1px 3px hsl(150 30% 20% / .10),0 6px 16px hsl(150 30% 20% / .07);
  --shadow-lg:0 4px 8px hsl(150 30% 20% / .10),0 16px 32px hsl(150 30% 20% / .12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:16px;line-height:1.55;color:var(--g900);
  background:var(--g50);background-image:radial-gradient(circle at 100% 0,var(--y100) 0,transparent 340px),radial-gradient(circle at 0 120px,var(--p100) 0,transparent 260px);background-repeat:no-repeat}
button,input{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 96px}
header h1{margin:0;font-size:30px;line-height:1.2;font-weight:800;letter-spacing:.02em;color:var(--g800)}
header p{margin:6px 0 0;color:var(--n600);font-size:15px}
.search{position:relative;margin-top:24px}
.search input{width:100%;height:60px;border:0;border-radius:16px;padding:0 52px 0 54px;font-size:18px;background:#fff;box-shadow:var(--shadow);outline:none;transition:box-shadow .2s}
.search input:focus{box-shadow:0 0 0 3px var(--g300),var(--shadow)}
.search svg{position:absolute;left:18px;top:18px;color:var(--g600)}
.search .clear{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--n500);cursor:pointer;display:none;font-size:20px}
.search .clear.on{display:block}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.quick span{font-size:13px;color:var(--n500);margin-right:2px}
.chip{border:0;background:var(--y100);color:var(--y700);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:32px;transition:transform .08s}
.chip:active{transform:scale(.96)}
.tabs{position:relative;display:flex;margin-top:28px;background:var(--g100);border-radius:14px;padding:4px}
.tabs button{position:relative;z-index:1;flex:1;height:44px;border:0;background:transparent;border-radius:10px;font-weight:600;color:var(--n600);cursor:pointer;transition:color .2s}
.tabs button.on{color:var(--g800)}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:#fff;box-shadow:var(--shadow-sm);transition:transform .28s cubic-bezier(.3,.7,.3,1),width .28s}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--g700);color:#fff;font-size:12px;line-height:20px}
.badge:empty{display:none}
.filters{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0 8px;align-items:center}
.seg{display:flex;gap:4px}
.seg button{border:0;background:transparent;border-radius:8px;padding:0 12px;height:36px;color:var(--n600);font-weight:600;cursor:pointer;font-size:14px}
.seg button.on{background:var(--g200);color:var(--g800)}
.seg-label{font-size:13px;color:var(--n500);margin-right:4px;align-self:center}
.count{margin-left:auto;font-size:14px;color:var(--n500)}
.section-title{margin:32px 0 12px;font-size:14px;font-weight:700;color:var(--n500);letter-spacing:.04em}
.card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.item-head{display:flex;align-items:flex-start;gap:12px}
.item-head h3{margin:0;font-size:20px;line-height:1.3}
.en{color:var(--n500);font-size:14px}
.add{margin-left:auto;flex:none;border:0;border-radius:10px;height:44px;padding:0 16px;background:var(--g700);color:#fff;font-weight:700;cursor:pointer;transition:transform .08s,background .2s}
.add:active{transform:scale(.97)}
.add.in{background:var(--g100);color:var(--g700)}
.src{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:12px 0;border-top:1px solid var(--g100)}
.item-head+.src{border-top:0;margin-top:8px}
.search input::-webkit-search-cancel-button{display:none}
.src .who{font-weight:700}
.src .where{grid-column:1;font-size:14px;color:var(--n600)}
.src .rate{grid-column:2;grid-row:1/3;text-align:right;align-self:center}
.rate b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.rate small{font-size:13px;color:var(--n500)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.t-Boss{background:var(--k100);color:var(--k700)}
.t-小Boss{background:var(--p100);color:var(--p700)}
.t-怪物{background:var(--g100);color:var(--g700)}
.t-小怪{background:hsl(150 10% 94%);color:var(--n600)}
.stars{color:hsl(40 90% 48%);letter-spacing:1px;font-size:13px}
.stars i{color:var(--g200);font-style:normal}
.r-common b{color:var(--g800)}
.r-rare b{color:var(--y700)}
.r-vrare b{color:var(--k700)}
.mob-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.mob-head h3{margin:0;font-size:18px}
.mob-meta{margin-top:4px;font-size:14px;color:var(--n600)}
.drops{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.drop{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:6px 10px;font-size:14px;background:var(--g50);min-height:36px;text-align:left}
.drop:hover{background:var(--g100)}
.drop em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.drop.rare{background:var(--y50)} .drop.rare em{color:var(--y700)}
.drop.vrare{background:var(--k100)} .drop.vrare em{color:var(--k700)}
.drop .gem{font-size:11px;color:inherit}
.drop.vrare .gem{color:var(--k700)} .drop.rare .gem{color:var(--y700)}
.none{font-size:14px;color:var(--n400)}
.stat{font-size:13px;color:var(--n600);margin-left:8px}
.empty{text-align:center;padding:48px 20px;color:var(--n600)}
.empty .big{font-size:40px}
.empty h3{margin:8px 0 4px;color:var(--g800)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--g100)}
.list-row:first-child{border-top:0}
.list-row .nm{flex:1;min-width:0}
.list-row .nm b{display:block}
.list-row .nm small{color:var(--n500);font-size:13px}
.list-row.done .nm b{text-decoration:line-through;color:var(--n400)}
.check{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--g300);background:#fff;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:900;padding:0}
.check.on{background:var(--g600);border-color:var(--g600)}
.step{display:flex;align-items:center;background:var(--g50);border-radius:10px}
.step button{width:36px;height:36px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--g700)}
.step span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border:0;background:transparent;color:var(--n400);cursor:pointer;font-size:18px;border-radius:8px}
.x:hover{background:var(--k100);color:var(--k700)}
.route h4{margin:0;font-size:17px}
.route .fl{font-size:13px;color:var(--n500)}
.route ul{list-style:none;padding:0;margin:12px 0 0}
.route li{display:flex;gap:12px;padding:8px 0;font-size:15px;align-items:baseline}
.route li .k{margin-left:auto;text-align:right;color:var(--n600);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.route li .k b{color:var(--g800)}
.accent{border-left:4px solid var(--g300)}
.foot{margin-top:40px;font-size:13px;color:var(--n500)}
.foot a{color:var(--g700)}
.btn-ghost{border:0;background:transparent;color:var(--n500);font-size:14px;cursor:pointer;padding:8px;border-radius:8px}
.btn-ghost:hover{color:var(--k700)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--g800);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:15px;transition:all .22s;pointer-events:none;max-width:calc(100% - 40px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hl{background:var(--y100);border-radius:3px}
.mapbox{position:relative;margin-top:24px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--g100)}
.mapbox img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;cursor:pointer;background:transparent;width:44px;height:44px;display:grid;place-items:center}
.pin i{display:block;width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:var(--g700);box-shadow:0 1px 4px hsl(150 40% 10% / .5);transition:transform .15s}
.pin.guess i{background:#fff;border-color:var(--p700);color:var(--p700);font-style:normal;font-size:11px;font-weight:900;line-height:12px}
.pin.game i{width:26px;height:26px;background:transparent;border:3px solid transparent;box-shadow:none}
.pin:hover i,.pin.on i{transform:scale(1.25)}
.pin.game:hover i,.pin.game.on i{border-color:var(--y100);box-shadow:0 0 0 3px var(--g700)}
.pin b{position:absolute;top:36px;white-space:nowrap;font-size:12px;font-weight:700;background:hsl(60 60% 98% / .92);color:var(--g800);padding:2px 8px;border-radius:8px;box-shadow:var(--shadow-sm);pointer-events:none}
.pin.guess b{color:var(--p700)}
.pin.up b{top:auto;bottom:36px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:13px;color:var(--n600)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--g700);display:inline-block}
.dot.q{background:#fff;border:2px solid var(--p700)}
.places{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.place{border:0;border-radius:10px;padding:0 14px;height:40px;background:#fff;box-shadow:var(--shadow-sm);font-weight:600;cursor:pointer;color:var(--g800)}
.place.guess{color:var(--p700)}
.place.on{background:var(--g700);color:#fff}
.place-info{margin-top:24px}
.place-info h3{margin:0;font-size:22px}
.place-info p{margin:6px 0 0;color:var(--n600)}
@media (max-width:600px){.pin b{display:none}.pin.on b{display:block}}
.eq-list{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:4px 20px;margin-top:16px}
.eq{padding:14px 0;border-top:1px solid var(--g100)}
.eq:first-child{border-top:0}
.eq-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.eq-top b{font-size:16px}
.eq-lv{margin-left:auto;font-weight:700;color:var(--g800);font-variant-numeric:tabular-nums;white-space:nowrap}
.eq-stat{font-size:14px;color:var(--n600);margin-top:2px}
.eq-bonus{font-size:14px;color:var(--g700);margin-top:2px}
.eq-src{margin-top:6px;font-size:13px}
.eq-src button{border:0;background:var(--y100);color:var(--y700);border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer;font-size:13px}
.rar{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}
.rar-普通{background:hsl(150 10% 93%);color:var(--n600)}
.rar-罕見{background:var(--g100);color:var(--g700)}
.rar-稀有{background:hsl(185 45% 90%);color:hsl(185 60% 24%)}
.rar-史詩{background:var(--p100);color:var(--p700)}
.rar-傳說{background:var(--y100);color:var(--y700)}
.rar-神話{background:var(--k100);color:var(--k700)}
.mini{font-size:12px;color:var(--n500);border:1px solid var(--g200);border-radius:6px;padding:0 6px}
.lvbox{display:flex;align-items:center;gap:8px}
.lvbox input{width:72px;height:36px;border:0;border-radius:8px;background:#fff;box-shadow:var(--shadow-sm);text-align:center;font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:#fff;box-shadow:var(--shadow-sm);border-radius:999px;padding:0 12px;height:34px;font-size:14px;font-weight:600;color:var(--n600);cursor:pointer}
.chips button.on{background:var(--g700);color:#fff}
.q{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:12px}
.q-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q-no{font-weight:800;color:var(--g600);font-variant-numeric:tabular-nums;min-width:2.2em}
.q-top h3{margin:0;font-size:17px}
.q-npc{font-size:14px;color:var(--n500)}
.q p{margin:8px 0 0;font-size:15px;color:var(--g900)}
.q-rw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.q-rw span{font-size:13px;font-weight:600;background:var(--y50);color:var(--y700);border-radius:8px;padding:2px 8px}
.q-tip{margin-top:8px;font-size:14px;color:var(--p700);background:var(--p100);border-radius:10px;padding:8px 12px}
.floor-h{margin:28px 0 12px;font-size:15px;font-weight:800;color:var(--g700)}
.tabs button{font-size:15px}
@media (max-width:600px){.tabs button{font-size:14px}.eq-list{padding:4px 16px}.q{padding:16px}}
.town{margin-top:16px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);max-width:560px}
.town img{display:block;width:100%;height:auto}
.town figcaption{background:#fff;padding:10px 14px;font-size:14px;color:var(--n600)}
.npc{background:#fff;border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-top:12px}
.npc b{font-size:16px}.npc .xyz{font-variant-numeric:tabular-nums;color:var(--g700);font-weight:700}
.ost{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.ost span{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--g100);color:var(--g700)}
.ost span.c{background:var(--p100);color:var(--p700)}
.ost small{font-size:12px;color:var(--n500)}
.rpt{border:0;background:transparent;color:var(--n400);font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px;margin-left:auto}
.rpt:hover{color:var(--k700);background:var(--k100)}
.note-card{background:var(--y50);border-radius:16px;padding:16px 20px;margin:8px 0 20px;box-shadow:var(--shadow-sm)}
.note-card h3{margin:0 0 8px;font-size:16px;color:var(--y700)}
.note-card ul{margin:0;padding-left:20px;font-size:14px;color:var(--g900)}
.note-card li{margin:4px 0}
.modal{position:fixed;inset:0;background:hsl(150 30% 10% / .4);display:none;place-items:center;padding:20px;z-index:20}
.modal.on{display:grid}
.modal div{background:#fff;border-radius:16px;padding:20px;max-width:480px;width:100%;box-shadow:var(--shadow-lg)}
.modal textarea{width:100%;height:160px;border:0;background:var(--g50);border-radius:10px;padding:12px;font:inherit;font-size:15px}
.modal button{margin-top:12px;height:44px;border:0;border-radius:10px;background:var(--g700);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}
.shop{margin-top:12px;border-top:1px solid var(--g100);padding-top:10px}
.shop-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shop-i{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.shop-i .k{white-space:nowrap;color:var(--n600);font-size:14px;font-variant-numeric:tabular-nums}
@media (max-width:600px){
  .wrap{padding:24px 16px 88px}
  header h1{font-size:24px}
  .card{padding:16px}
  .item-head h3{font-size:18px}
  .count{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:opacity .15s!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>艾恩葛朗特掉落圖鑑</h1>
    <p>第 1–3 層 · <span id="total"></span> 種生物 · <span id="eqn"></span> 件裝備 · <span id="qn"></span> 個任務</p>
  </header>
  <div class="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="輸入道具、怪物、裝備或 NPC，例如：阿爾巴爾之牙、狩獵弓" autocomplete="off">
    <button class="clear" id="clear" aria-label="清除">×</button>
  </div>
  <div class="quick" id="quick"><span>常查：</span></div>
  <nav class="tabs" id="tabs">
    <div class="pill" id="pill"></div>
    <button data-tab="item" class="on">查詢</button>
    <button data-tab="mob">怪物</button>
    <button data-tab="eq">裝備</button>
    <button data-tab="quest">任務</button>
    <button data-tab="map">地圖</button>
    <button data-tab="list">清單<span class="badge" id="lc"></span></button>
  </nav>
  <main id="main"></main>
  <p class="foot">資料來源：<a href="https://saominecraft.wiki.gg/" target="_blank" rel="noopener">SAO Minecraft Wiki</a> 的怪物圖鑑、裝備與任務頁（2026/11/24 擷取），主線任務說明由英文版翻譯；第 2、3 層怪物的等級與生命值、地城與鑰匙資訊取自 <a href="https://saominecraft.com/news" target="_blank" rel="noopener">官方公告</a>。「平均約幾隻」是用掉落機率算出的期望值，實際會依運氣上下浮動。</p>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pnum = p => p && p.endsWith('%') ? parseFloat(p) : null;
const rclass = v => v == null ? 'common' : v < 1 ? 'vrare' : v < 10 ? 'rare' : 'common';
const stars = n => n ? '★'.repeat(n) + '<i>' + '★'.repeat(5 - n) + '</i>' : '';
const kills = v => v ? Math.ceil(100 / v) : null;

// 道具索引
const ITEMS = {};
MOBS.forEach(m => m.d.forEach(d => {
  const k = d.i;
  (ITEMS[k] ||= {name: d.i, en: d.e, src: []}).src.push({m, p: d.p, v: pnum(d.p), note: d.n});
  if (!ITEMS[k].en && d.e) ITEMS[k].en = d.e;
}));
Object.values(ITEMS).forEach(it => it.src.sort((a, b) => (b.v ?? 50) - (a.v ?? 50)));

let state = {tab: 'item', q: '', floor: 0, type: '全部', mapFloor: 1, place: '', eqCat: '全部', myLv: 0, qType: 'main', qFloor: -1};
let list = {};
try { list = JSON.parse(localStorage.getItem('sao-list') || '{}'); } catch (e) {}
const saveList = () => { try { localStorage.setItem('sao-list', JSON.stringify(list)); } catch (e) {} };

const norm = s => String(s || '').toLowerCase().replace(/[\s'’，,]/g, '');
const match = (q, ...xs) => xs.some(x => norm(x).includes(q));
const hl = (s, q) => {
  const raw = state.q.trim();
  if (!q || !raw) return esc(s);
  const i = String(s).toLowerCase().indexOf(raw.toLowerCase());
  return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<span class="hl">' + esc(s.slice(i, i + raw.length)) + '</span>' + esc(s.slice(i + raw.length));
};
const place = m => `第 ${m.f} 層 · ${esc(m.r)}${m.re && m.re !== m.r ? ` <span class="en">(${esc(m.re)})</span>` : ''}`;

function itemCard(it, q) {
  const inList = !!list[it.name];
  return `<article class="card">
    <div class="item-head"><div><h3>${hl(it.name, q)}</h3>${it.en && it.en !== it.name ? `<div class="en">${hl(it.en, q)}</div>` : ''}</div>
    <button class="add ${inList ? 'in' : ''}" data-add="${esc(it.name)}">${inList ? '✓ 已在清單' : '＋ 加入清單'}</button></div>
    ${(() => { const e = EQ.find(e => e.n === it.name); return e ? `<div class="eq-list" style="box-shadow:none;background:var(--g50);margin:12px 0 4px">${eqRow(e, '').replace(/<div class="eq-src">[\s\S]*?<\/div>/, '')}</div>` : ''; })()}
    ${it.src.map(s => `<div class="src r-${rclass(s.v)}">
      <div class="who">${esc(s.m.n)}<span class="tag t-${s.m.t}">${s.m.t}</span> <span class="stars">${stars(s.m.s)}</span></div>
      <div class="where">${place(s.m)}${s.m.b === '主動' ? ' · 會主動攻擊' : ''}</div>
      <div class="rate"><b>${s.p === '?' ? '?' : esc(s.p)}</b><small>${s.v ? (s.v >= 100 ? '必掉' : `平均約 ${kills(s.v)} 隻`) : esc(s.note || '機率未知')}</small></div>
    </div>`).join('')}
  </article>`;
}

function mobCard(m, q) {
  const st = [m.st.hp ? `生命值 ${m.st.hp}` : '', m.st.speed ? `速度 ${m.st.speed}` : ''].filter(Boolean).join(' · ');
  return `<article class="card">
    <div class="mob-head"><h3>${hl(m.n, q)}</h3>${m.ne !== m.n ? `<span class="en">${hl(m.ne, q)}</span>` : ''}<span class="tag t-${m.t}">${m.t}</span><button class="rpt" data-rpt="怪物|${esc(m.n)}|${esc(m.ne)}">回報錯誤</button></div>
    <div class="mob-meta">${place(m)} · ${m.b === '主動' ? '會主動攻擊' : m.b === '中立' ? '中立（被打才反擊）' : '被動（不攻擊）'} ${m.s ? '· <span class="stars">' + stars(m.s) + '</span>' : ''}${st ? `<span class="stat">${st}</span>` : ''}</div>
    ${m.ost ? `<div class="ost">${m.ost.lv ? `<span>Lv. ${esc(m.ost.lv)}</span>` : ''}${m.ost.hp ? `<span>生命值 ${esc(m.ost.hp)}</span>` : ''}${m.ost.dmg ? `<span>傷害 ${esc(m.ost.dmg)}</span>` : ''}${m.ost.chp ? `<span class="c">腐化版生命值 ${esc(m.ost.chp)}</span>` : ''}<small>官方 11/10 公告數值</small></div>` : ''}
    <div class="drops">${m.d.length ? m.d.map(d => {
      const v = pnum(d.p), c = rclass(v);
      return `<button class="drop ${c}" data-item="${esc(d.i)}" title="查看哪裡會掉 ${esc(d.i)}"><em>${esc(d.p)}</em>${hl(d.i, q)}${c === 'vrare' ? '<span class="gem">◆</span>' : c === 'rare' ? '<span class="gem">◇</span>' : ''}</button>`;
    }).join('') : '<span class="none">沒有已知掉落物</span>'}</div>
  </article>`;
}

function renderItem() {
  const q = norm(state.q);
  if (!q) return `<div class="empty"><div class="big">🗡️</div><h3>想刷什麼材料？</h3><p>在上面輸入道具名稱，中文或英文都可以。<br>也可以點「常查」裡的道具，或到「圖鑑」直接點怪物的掉落物。</p></div>`;
  const items = Object.values(ITEMS).filter(it => match(q, it.name, it.en));
  const mobs = MOBS.filter(m => match(q, m.n, m.ne, m.r, m.re));
  const eqs = EQ.filter(e => match(q, e.n) && !ITEMS[e.n]);
  const mqs = MQ.filter(x => match(q, x[2], x[3], x[8]));
  const sqs = SQ.filter(x => match(q, x.npc, x.town, x.task));
  const npcs = ALL_NPC().filter(n => match(q, n.n, n.role, n.place, n.sells));
  if (!npcs.length && !items.length && !mobs.length && !eqs.length && !mqs.length && !sqs.length) {
    // 模糊搜尋：遊戲內中文和 wiki 翻譯不同時，用相同的字來猜
    const qs = [...new Set([...state.q.replace(/\s/g, '')])];
    const score = s => { const t = String(s); return qs.filter(c => t.includes(c)).length; };
    const near = Object.values(ITEMS).map(it => ({it, sc: score(it.name)})).filter(x => x.sc >= Math.max(1, Math.ceil(qs.length * 0.3))).sort((a, b) => b.sc - a.sc).slice(0, 6);
    return `<div class="empty"><div class="big">🔍</div><h3>找不到「${esc(state.q)}」</h3><p>${near.length ? '遊戲裡的名稱可能跟 wiki 不一樣，你是不是要找：' : '換個字試試，例如只輸入一部分「牙」或英文「fang」。'}</p></div>`
      + near.map(x => itemCard(x.it, '')).join('');
  }
  let h = '';
  if (items.length) h += `<div class="section-title">道具 · ${items.length} 項</div>` + items.slice(0, 40).map(it => itemCard(it, q)).join('');
  if (npcs.length) h += `<div class="section-title">NPC · ${npcs.length} 位</div>` + npcs.map(n => npcCard({...n, role: `第 ${n.f} 層 ${n.place}` + (n.role ? ' · ' + n.role : '')})).join('');
  if (eqs.length) h += `<div class="section-title">裝備 · ${eqs.length} 件</div><div class="eq-list">` + eqs.slice(0, 30).map(e => eqRow(e, q)).join('') + '</div>';
  if (mobs.length) h += `<div class="section-title">相關怪物 · ${mobs.length} 隻</div>` + mobs.slice(0, 30).map(m => mobCard(m, q)).join('');
  if (mqs.length || sqs.length) h += `<div class="section-title">任務 · ${mqs.length + sqs.length} 個</div>` + mqs.slice(0, 20).map(x => mqCard(x, q)).join('') + sqs.map(x => sqCard(x, q)).join('');
  return h;
}

function renderMob() {
  const q = norm(state.q);
  const rows = MOBS.filter(m => (!state.floor || m.f === state.floor)
    && (state.type === '全部' || (state.type === 'Boss' ? (m.t === 'Boss' || m.t === '小Boss') : (m.t === '怪物' || m.t === '小怪')))
    && (!q || match(q, m.n, m.ne, m.r, m.re, ...m.d.map(d => d.i), ...m.d.map(d => d.e))));
  const seg = (key, vals, labels) => `<div class="seg">${vals.map((v, i) => `<button data-${key}="${v}" class="${state[key] == v ? 'on' : ''}">${labels[i]}</button>`).join('')}</div>`;
  return `<div class="filters">
      <span class="seg-label">樓層</span>${seg('floor', [0, 1, 2, 3], ['全部', '1', '2', '3'])}
      <span class="seg-label">類型</span>${seg('type', ['全部', 'Boss', '一般'], ['全部', 'Boss', '一般怪'])}
      <span class="count">${rows.length} 隻${q ? `（含「${esc(state.q)}」）` : ''}</span></div>`
    + (rows.length ? rows.map(m => mobCard(m, q)).join('') : `<div class="empty"><h3>沒有符合條件的怪物</h3><p>試試切回「全部」或清除搜尋。</p></div>`);
}

function renderList() {
  const names = Object.keys(list);
  if (!names.length) return `<div class="empty"><div class="big">📜</div><h3>清單是空的</h3><p>在「查道具」找到想刷的材料，按「＋ 加入清單」，<br>這裡就會幫你整理要去哪裡、打哪隻怪。</p></div>`;
  // 每個道具選掉率最高的來源，依地點分組
  const route = {};
  names.forEach(n => {
    const it = ITEMS[n]; if (!it) return;
    const e = list[n]; if (e.done) return;
    const best = it.src[0];
    const key = best.m.f + '|' + best.m.r;
    (route[key] ||= {f: best.m.f, r: best.m.r, re: best.m.re, rows: []}).rows.push({n, e, best, alt: it.src.length - 1});
  });
  const groups = Object.values(route).sort((a, b) => a.f - b.f);
  const left = names.filter(n => !list[n].done).length;
  return `<div class="section-title">要刷的材料 · 剩 ${left} / ${names.length} 項</div>
    <article class="card">${names.map(n => {
      const e = list[n], it = ITEMS[n] || {en: ''};
      return `<div class="list-row ${e.done ? 'done' : ''}">
        <button class="check ${e.done ? 'on' : ''}" data-done="${esc(n)}" aria-label="標記完成">${e.done ? '✓' : ''}</button>
        <div class="nm"><b>${esc(n)}</b><small>${esc(it.en || '')}</small></div>
        <div class="step"><button data-dec="${esc(n)}" aria-label="減少">−</button><span>${e.qty}</span><button data-inc="${esc(n)}" aria-label="增加">＋</button></div>
        <button class="x" data-del="${esc(n)}" aria-label="移除">×</button></div>`;
    }).join('')}</article>
    ${groups.length ? `<div class="section-title">刷怪路線 · 依地點整理（每項都選掉率最高的怪）</div>` + groups.map(g => `
      <article class="card route accent"><h4>${esc(g.r)}${g.re && g.re !== g.r ? ` <span class="en">${esc(g.re)}</span>` : ''}</h4><div class="fl">第 ${g.f} 層</div>
      <ul>${g.rows.map(r => `<li><span><b>${esc(r.n)}</b> × ${r.e.qty}<br><small class="en">打 ${esc(r.best.m.n)}（${esc(r.best.p)}）${r.alt ? ` · 另有 ${r.alt} 隻也會掉` : ''}</small></span>
        <span class="k">${r.best.v ? (r.best.v >= 100 ? `<b>${r.e.qty}</b> 隻` : `約 <b>${Math.ceil(r.e.qty * 100 / r.best.v)}</b> 隻`) : '機率未知'}</span></li>`).join('')}</ul></article>`).join('')
      : `<div class="empty"><h3>全部刷完了 🎉</h3><p>可以按下面的按鈕清空清單。</p></div>`}
    <p style="text-align:right"><button class="btn-ghost" id="clearList">清空清單</button></p>`;
}

// ═══ 地圖：新增樓層時，在這裡加一筆（x、y 是圖片上的百分比位置）═══

const npcCard = p => `<div class="npc"><b>${esc(p.n)}</b>${p.role ? ` <span class="mini">${esc(p.role)}</span>` : ''}${p.xyz ? `<div class="eq-stat">座標 <span class="xyz">${esc(p.xyz)}</span>（X, Y, Z）</div>` : ''}<div class="eq-stat">${p.sells ? '販售：' + esc(p.sells) : '販售清單還沒有資料'}</div>${p.shop ? p.shop.map(shopGroup).join('') + '<p class="foot" style="margin:10px 0 0">價格是製作費用（col），還要另外準備材料；材料清單要點進遊戲裡的配方才看得到。</p>' : ''}</div>`;
const shopGroup = g => { const mob = MOBS.find(m => m.n === g.from); return `<div class="shop"><div class="shop-h"><b>${esc(g.g)}</b>${mob ? `<button class="chip" data-q="${esc(mob.n)}">材料怪：${esc(mob.n)}（${esc(mob.r)}）›</button>` : ''}</div>${g.items.map(([n, c, tm]) => { const e = EQ.find(x => x.n === n); return `<div class="shop-i"><span>${esc(n)}${e ? ` <span class="rar rar-${esc(e.r)}">${esc(e.r)}</span> <span class="mini">Lv. ${e.lv}</span>` : ''}${e && e.b ? `<br><small class="en">${esc(e.b)}</small>` : ''}</span><span class="k">${c} col · ${esc(tm)}</span></div>`; }).join('')}</div>`; };
const ALL_NPC = () => Object.entries(MAPS).flatMap(([f, m]) => m.pins.flatMap(p => (p.npcs || []).map(n => ({...n, f: +f, place: p.name}))));
function renderMap() {
  const seg = `<div class="filters"><span class="seg-label">樓層</span><div class="seg">${[1, 2, 3].map(f => `<button data-mapfloor="${f}" class="${state.mapFloor === f ? 'on' : ''}">第 ${f} 層</button>`).join('')}</div></div>`;
  const mp = MAPS[state.mapFloor];
  if (!mp) return seg + `<div class="empty"><div class="big">🗺️</div><h3>第 ${state.mapFloor} 層的地圖還沒放上來</h3><p>可以先到「圖鑑」用樓層篩選查這層的怪物。</p></div>`;
  const sel = mp.pins.find(p => p.name === state.place);
  const cls = p => p.kind === 'guess' ? 'guess' : p.kind === 'game' ? 'game' : '';
  let h = seg + `<div class="mapbox"><img src="${mp.img}" alt="第 ${state.mapFloor} 層地圖">${mp.pins.map(p =>
    `<button class="pin ${cls(p)} ${p.up ? 'up' : ''} ${sel === p ? 'on' : ''}" style="left:${p.x}%;top:${p.y}%" data-place="${esc(p.name)}" aria-label="${esc(p.name)}"><i>${p.kind === 'guess' ? '?' : ''}</i>${p.kind !== 'game' ? `<b>${esc(p.name)}${p.kind === 'guess' ? '？' : ''}</b>` : ''}</button>`).join('')}</div>
    <div class="legend"><span><i class="dot"></i>比較確定</span>${mp.pins.some(p => p.kind === 'guess') ? '<span><i class="dot q"></i>推測（依動畫和 wiki 描述）</span>' : ''}<span>遊戲原本的地名也可以點</span></div>
    <div class="places">${mp.pins.map(p => `<button class="place ${p.kind === 'guess' ? 'guess' : ''} ${sel === p ? 'on' : ''}" data-place="${esc(p.name)}">${esc(p.name)}${p.kind === 'guess' ? '？' : ''}</button>`).join('')}</div>`;
  if (sel) {
    const mobs = MOBS.filter(m => m.f === state.mapFloor && sel.regions.includes(m.r));
    h += `<div class="place-info"><h3>${esc(sel.name)}${sel.kind === 'guess' ? '（推測）' : ''}</h3><p>${esc(sel.note)}</p></div>`
      + (sel.npcs ? `<div class="section-title">NPC · ${sel.npcs.length} 位</div>` + sel.npcs.map(npcCard).join('') : '')
      + (sel.town ? `<figure class="town" style="margin-left:0;margin-right:0"><img src="${sel.town}" alt="${esc(sel.name)}城鎮地圖"><figcaption>${esc(sel.townNote || '')}</figcaption></figure>` : '')
      + (mobs.length ? `<div class="section-title">這裡的怪物 · ${mobs.length} 隻</div>` + mobs.map(m => mobCard(m, '')).join('') : '');
  } else h += `<p class="foot" style="margin-top:16px">點地圖上的點或上面的地名，就會列出那裡有哪些怪。</p>`;
  return h;
}

const EQ_CATS = ['全部', ...new Set(EQ.map(e => e.c))];
const FLOOR_NAME = {0: '教學', 1: '第 1 層 · 起始之鎮', 2: '第 2 層 · Urbus', 3: '第 3 層 · 迷霧森林'};

function eqRow(e, q) {
  const src = ITEMS[e.n];
  const stat = [e.d ? `傷害 ${esc(e.d)}` : '', e.s ? `攻速 ${esc(e.s)}` : ''].filter(Boolean).join(' · ');
  return `<div class="eq"><div class="eq-top"><b>${hl(e.n, q)}</b>${e.r ? `<span class="rar rar-${esc(e.r)}">${esc(e.r)}</span>` : ''}<span class="mini">${esc(e.sub || e.c)}</span>${e.two ? '<span class="mini">雙手</span>' : ''}<span class="eq-lv">Lv. ${e.lv || '?'}</span><button class="rpt" style="margin-left:4px" data-rpt="裝備|${esc(e.n)}|">回報</button></div>
    ${stat ? `<div class="eq-stat">${stat}</div>` : ''}${e.b ? `<div class="eq-bonus">${esc(e.b)}</div>` : ''}${e.src ? `<div class="eq-stat">取得：${esc(e.src)}</div>` : ''}
    ${src ? `<div class="eq-src"><button data-item="${esc(e.n)}">怪物掉落：${src.src.map(s => esc(s.m.n) + ' ' + esc(s.p)).join('、')} ›</button></div>` : ''}</div>`;
}

function renderEq() {
  const q = norm(state.q);
  let rows = EQ.filter(e => (state.eqCat === '全部' || e.c === state.eqCat) && (!state.myLv || e.lv <= state.myLv) && (!q || match(q, e.n, e.b, e.sub)));
  rows = rows.slice().sort((a, b) => state.myLv ? (b.lv - a.lv) : (a.lv - b.lv));
  return `<div class="filters"><div class="chips">${EQ_CATS.map(c => `<button data-eqcat="${esc(c)}" class="${state.eqCat === c ? 'on' : ''}">${esc(c)}</button>`).join('')}</div></div>
    <div class="filters"><div class="lvbox"><span class="seg-label">我的等級</span><input id="mylv" type="number" min="1" max="99" inputmode="numeric" placeholder="全部" value="${state.myLv || ''}"></div>
    <span class="count">${rows.length} 件${state.myLv ? `（Lv. ${state.myLv} 以下能用的，等級高的排前面）` : '（依等級排序）'}</span></div>
    ${rows.length ? `<div class="eq-list">${rows.map(e => eqRow(e, q)).join('')}</div>` : `<div class="empty"><h3>沒有符合條件的裝備</h3><p>試試切回「全部」或清空等級。</p></div>`}`;
}

function mqCard(x, q) {
  const rw = [x[5] ? `EXP ${Number(x[5]).toLocaleString()}` : '', x[6] ? `${Number(x[6]).toLocaleString()} col` : '', x[7]].filter(Boolean);
  return `<article class="q"><div class="q-top"><span class="q-no">#${esc(x[1])}</span><h3>${hl(x[3], q)}</h3>${x[2] ? `<span class="q-npc">NPC：${hl(x[2], q)}</span>` : ''}<button class="rpt" data-rpt="主線任務|第 ${x[0]} 層 #${esc(x[1])} ${esc(x[3])}|">回報</button></div>
    <p>${hl(x[8], q)}</p>${rw.length ? `<div class="q-rw">${rw.map(r => `<span>${esc(r)}</span>`).join('')}</div>` : ''}</article>`;
}
function sqCard(x, q) {
  return `<article class="q"><div class="q-top"><h3>${hl(x.npc, q)}</h3><span class="q-npc">${esc(x.town)}${x.xyz ? `　座標 ${esc(x.xyz)}` : ''}</span></div>
    <p>${hl(x.task, q)}</p><div class="q-rw"><span>EXP ${esc(x.exp)}</span><span>${esc(x.col)} col</span></div>${x.tip ? `<div class="q-tip">💡 ${esc(x.tip)}</div>` : ''}</article>`;
}
function renderQuest() {
  const q = norm(state.q);
  const seg = `<div class="filters"><div class="seg"><button data-qtype="main" class="${state.qType === 'main' ? 'on' : ''}">主線</button><button data-qtype="side" class="${state.qType === 'side' ? 'on' : ''}">支線</button></div>
    ${state.qType === 'main' ? `<span class="seg-label">樓層</span><div class="seg">${[-1, 0, 1, 2, 3].map(f => `<button data-qfloor="${f}" class="${state.qFloor === f ? 'on' : ''}">${f < 0 ? '全部' : f === 0 ? '教學' : f}</button>`).join('')}</div>` : ''}</div>`;
  if (state.qType === 'side') {
    const rows = SQ.filter(x => !q || match(q, x.npc, x.town, x.task));
    return seg + `<p class="foot" style="margin-top:4px">支線目前只有第 1 層的資料。座標是遊戲裡的 X, Y, Z。</p>` + (rows.length ? rows.map(x => sqCard(x, q)).join('') : `<div class="empty"><h3>沒有符合的支線</h3></div>`);
  }
  let h = seg + `<div class="note-card"><h3>官方公告重點（2026/11）</h3><ul>
      <li>等級上限：一開始 Lv. 13，打完狗頭人地城升到 16，打完牛頭人之王升到 20。</li>
      <li>樓層地城要先做到該層「倒數第二個主線任務」才能進（第 1 層是第 35 個）。沒做完，地城入口的告示牌會顯示紅色鎖頭。</li>
      <li>地城可以少人開，難度會依人數調整；但還是要有鑰匙。</li>
      <li>考古學家賣的鑰匙：狗頭人 5,000 col、Melliona（蜂巢）1,750 col、死靈法師 2,000 col、牛頭人之王 10,000 col（進場就消耗）。</li>
      <li>第 3 層的神秘商人賣 14 種飾品，每個 65,000 col，每天最多買 1 個、每週最多 2 個。</li>
    </ul></div><p class="foot" style="margin-top:4px">主線依順序排列。說明是從 wiki 英文版翻譯的，NPC 名字保留原文。</p>`;
  [0, 1, 2, 3].filter(f => state.qFloor < 0 || f === state.qFloor).forEach(f => {
    const rows = MQ.filter(x => +x[0] === f && (!q || match(q, x[2], x[3], x[8])));
    if (rows.length) h += `<div class="floor-h">${FLOOR_NAME[f]}</div>` + rows.map(x => mqCard(x, q)).join('');
  });
  return h;
}

function render() {
  $('#main').innerHTML = state.tab === 'item' ? renderItem() : state.tab === 'mob' ? renderMob() : state.tab === 'map' ? renderMap() : state.tab === 'eq' ? renderEq() : state.tab === 'quest' ? renderQuest() : renderList();
  const n = Object.values(list).filter(e => !e.done).length;
  $('#lc').textContent = n || '';
  $('#clear').classList.toggle('on', !!state.q);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  movePill();
}
function movePill() {
  const b = document.querySelector(`#tabs button[data-tab="${state.tab}"]`);
  $('#pill').style.width = b.offsetWidth + 'px';
  $('#pill').style.transform = `translateX(${b.offsetLeft - 4}px)`;
}

$('#clear').onclick = () => { state.q = ''; $('#q').value = ''; $('#q').focus(); render(); };
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { state.tab = d.tab; render(); }
  else if (d.q) { state.q = d.q; $('#q').value = d.q; state.tab = 'item'; render(); }
  else if (d.item) { state.q = d.item; $('#q').value = d.item; state.tab = 'item'; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else if (d.eqcat) { state.eqCat = d.eqcat; render(); }
  else if (d.qtype) { state.qType = d.qtype; render(); }
  else if (d.qfloor !== undefined) { state.qFloor = +d.qfloor; render(); }
  else if (d.mapfloor) { state.mapFloor = +d.mapfloor; state.place = ''; render(); }
  else if (d.place) { state.place = state.place === d.place ? '' : d.place; render(); }
  else if (d.floor !== undefined) { state.floor = +d.floor; render(); }
  else if (d.type) { state.type = d.type; render(); }
  else if (d.add) {
    if (list[d.add]) { toast(`「${d.add}」已經在清單裡了`); return; }
    list[d.add] = {qty: 1, done: false}; saveList(); render(); toast(`已加入清單：${d.add}`);
  }
  else if (d.inc) { list[d.inc].qty++; saveList(); render(); }
  else if (d.dec) { list[d.dec].qty = Math.max(1, list[d.dec].qty - 1); saveList(); render(); }
  else if (d.done) { list[d.done].done = !list[d.done].done; saveList(); render(); }
  else if (d.del) { delete list[d.del]; saveList(); render(); toast(`已移除：${d.del}`); }
  else if (t.id === 'clearList') { list = {}; saveList(); render(); toast('清單已清空'); }
});
document.addEventListener('change', e => { if (e.target.id === 'mylv') { state.myLv = Math.max(0, parseInt(e.target.value) || 0); render(); } });
function report(kind, name, en) {
  const text = `【圖鑑回報】\n類型：${kind}\n名稱：${name}${en && en !== name ? `（${en}）` : ''}\n網站寫的：\n遊戲裡實際是：\n（可以附上遊戲截圖）`;
  const show = () => { const m = $('#modal'); m.querySelector('textarea').value = text; m.classList.add('on'); m.querySelector('textarea').select(); };
  try { navigator.clipboard.writeText(text).then(() => toast('已複製回報範本，補上正確內容後貼給網站維護者'), show); } catch (e) { show(); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-rpt]'); if (b) { e.stopPropagation(); const [k, n, en] = b.dataset.rpt.split('|'); report(k, n, en); }
  if (e.target.id === 'modal' || e.target.id === 'mclose') $('#modal').classList.remove('on');
}, true);
window.addEventListener('resize', movePill);
render();
</script>
</body>
</html>
