<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>像素小窩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: room stage on the left, one working panel on the right; stacks to one column on phones. */
:root{--outline:#5a4632;--outline-soft:#c9b48a;
  --bg:#edf5e4; --surface:#fbfdf5; --surface-2:#e0ecd2; --line:#c9d9b8;
  --ink:#243020; --muted:#5d6e52;
  --accent:#5f9e4c; --accent-strong:#467a36; --on-accent:#ffffff;
  --sun:#f7eaa6; --sun-ink:#5b4a06;
  --bad:#a8492a; --shadow:0 1px 2px rgba(36,48,32,.08),0 6px 18px rgba(36,48,32,.07);
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--outline:#0f140c;--outline-soft:#55684a;
  --bg:#182015; --surface:#222c1e; --surface-2:#2c3927; --line:#3b4c34;
  --ink:#e7f0db; --muted:#a1b393;
  --accent:#7fbd69; --accent-strong:#98d182; --on-accent:#10210b;
  --sun:#4d4518; --sun-ink:#f5e8a8;
  --bad:#f0977a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{--outline:#0f140c;--outline-soft:#55684a;
  --bg:#182015; --surface:#222c1e; --surface-2:#2c3927; --line:#3b4c34;
  --ink:#e7f0db; --muted:#a1b393;
  --accent:#7fbd69; --accent-strong:#98d182; --on-accent:#10210b;
  --sun:#4d4518; --sun-ink:#f5e8a8;
  --bad:#f0977a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow:hidden;overscroll-behavior:none}
.app{position:relative;height:100%;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.hud{position:absolute;left:0;right:0;top:0;padding:12px 16px;pointer-events:none}
.stat{box-shadow:var(--shadow)}
.brand h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1.1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:900;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.coin{background:var(--sun);color:var(--sun-ink)}
.stat.coin b{color:var(--sun-ink)}

canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.dock{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.dock .in{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:var(--surface);padding:6px;border-radius:14px;box-shadow:var(--shadow);max-width:100%}
.dock button{border:0;background:transparent;border-radius:9px;padding:9px 10px;font-weight:700;font-size:14px}
.dock button:hover{background:var(--surface-2)}
.dock button.main{background:var(--accent);color:var(--on-accent)}
.dock button:disabled{opacity:.4;cursor:not-allowed}
.side{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.side button{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:13px;padding:0}
.joy{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(36,48,32,.2);border:2px solid rgba(255,255,255,.65);pointer-events:none;z-index:2}
.joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow)}
.veil{position:absolute;inset:0;background:rgba(20,28,16,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:3}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:540px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;justify-content:flex-end;padding:8px 8px 0}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;font-weight:900;font-size:15px;padding:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px}
.btn:hover{background:var(--accent-strong)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.soft:hover{background:var(--line)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}


.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:var(--surface-2)}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#panel>*{flex-shrink:0}
#panel{padding:0 18px 20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;min-height:0}
h2{margin:0;font-size:18px;font-weight:900}
h3{margin:0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.lead{margin:4px 0 0;color:var(--muted);font-size:13px}
.sec{display:flex;flex-direction:column;gap:10px}

.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--bg);min-width:0}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:700}
.meta{color:var(--muted);font-size:12px}
.item.done{background:var(--surface-2)}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.done .tick{background:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:10px;background:var(--bg);text-align:center}
.card img,.pix{image-rendering:pixelated}
.card img{height:56px;width:auto}
.card .name{font-weight:700;font-size:14px}
.price{font-family:var(--display);font-variant-numeric:tabular-nums}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.album figure{margin:0}
.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.album figcaption{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;width:100%;max-width:140px}
.bar i{display:block;height:100%;background:var(--accent)}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.opt{border:2px solid transparent;background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2)}
.field{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;width:100%;max-width:180px}
.empty{color:var(--muted);font-size:13px;margin:0}

.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px}
.ttt button{aspect-ratio:1;border:0;border-radius:10px;background:var(--bg);font-size:34px;font-weight:900;line-height:1}
.gmk{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;background:var(--line);padding:2px;border-radius:8px;max-width:400px}
.gmk button{aspect-ratio:1;border:0;padding:0;background:var(--sun);display:grid;place-items:center;min-width:0}
.gmk i{width:74%;height:74%;border-radius:50%;display:block}
.gmk .p1 i{background:var(--ink)} .gmk .p2 i{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)}
.pad{border:0;border-radius:14px;min-height:150px;width:100%;background:var(--surface-2);font-size:18px;font-weight:900}
.pad.go{background:var(--accent);color:var(--on-accent)}
.pad.wait{background:var(--sun);color:var(--sun-ink)}
.result{font-weight:700}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);z-index:5}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.menu{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-weight:900;font-size:13px;padding:0;z-index:1}
.dock.pop{left:auto;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));padding:0}
.dock.pop .in{display:grid;grid-template-columns:repeat(3,1fr)}
.dock .em{color:var(--muted)}
.actbtn{position:absolute;right:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 8px;z-index:1}
.actbtn:active{background:var(--accent-strong)}
.actbtn b{font-size:18px;font-weight:900;line-height:1.2}
.actbtn span{font-size:11px;opacity:.92;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble{margin:8px 0 0;background:var(--sun);color:var(--sun-ink);padding:10px 14px;border-radius:4px 14px 14px 14px;font-weight:500}
.hud{display:flex;flex-direction:column;gap:8px}
.stories{display:flex;gap:10px;overflow-x:auto;pointer-events:auto;padding:3px;scrollbar-width:none;align-self:flex-start;max-width:100%}
.story{flex:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;font-size:11px;font-weight:700;color:var(--ink)}
.story img,.story i{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);outline:2px solid var(--accent);display:grid;place-items:center;background:var(--sun);color:var(--sun-ink);font-style:normal;font-size:22px;font-weight:900}
.story span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface);border-radius:6px;padding:0 5px}
.post{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--bg);min-width:0}
.post .ph{width:100%;border-radius:8px;display:block}
.post .who{display:flex;align-items:center;gap:8px;font-weight:700}
.post .cap{margin:0}
.re{border:0;border-radius:999px;background:var(--surface);padding:5px 11px;font-size:15px}
.re[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);font-weight:700}
.cm{margin:0;font-size:13px}.cm b{margin-right:6px}
.field.wide{max-width:none;flex:1;min-width:0}
.draft{width:72px;height:72px;border-radius:8px;object-fit:cover;flex:none}
.rar{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.rar.r2{background:var(--sun);color:var(--sun-ink)}.rar.r3{background:var(--accent);color:var(--on-accent)}
.sw:disabled,.opt:disabled{opacity:.35;cursor:not-allowed}
:root{--ball1:#8fbf7a;--ball2:#f6d860;--ball3:#f08a7a}
.vid{width:100%;display:block;background:var(--ink);max-height:60vh;object-fit:cover}
.gm{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 12px;border-radius:14px;background:var(--bg)}
.gmbox{width:132px;transform-origin:50% 100%}
.dome{height:98px;border-radius:66px 66px 10px 10px;background:var(--surface);border:4px solid var(--line);position:relative;overflow:hidden}
.dome b{position:absolute;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.gmbase{height:56px;border-radius:8px 8px 12px 12px;background:var(--accent);position:relative}
.knob{position:absolute;left:20px;top:13px;width:28px;height:28px;border-radius:50%;background:var(--sun);border:3px solid var(--sun-ink)}
.knob::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:4px;margin-left:-2px;border-radius:2px;background:var(--sun-ink)}
.chute{position:absolute;right:16px;bottom:9px;width:40px;height:26px;border-radius:6px;background:var(--ink)}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;justify-items:center;width:100%;max-width:340px}
.tray.one{grid-template-columns:minmax(0,120px);justify-content:center}
.tray .card{width:100%;padding:8px 2px;gap:3px}.tray .card img{height:40px}.tray .card .name{font-size:11px}.tray .card .meta{font-size:10px}
.ball{max-width:100%;aspect-ratio:1;height:auto!important}
.ball{width:54px;height:54px;border-radius:50%;border:0;padding:0;position:relative;box-shadow:inset 0 -7px 0 rgba(0,0,0,.14),inset 0 5px 0 rgba(255,255,255,.4)}
.ball::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:rgba(0,0,0,.2)}
.ball.r1,.dome .r1{background:var(--ball1)}.ball.r2,.dome .r2{background:var(--ball2)}.ball.r3,.dome .r3{background:var(--ball3)}
.ball.drop{animation:drop .7s cubic-bezier(.3,1.3,.6,1) backwards}
@keyframes drop{0%{transform:translateY(-150px) scale(.5);opacity:0}55%{transform:translateY(8px)}78%{transform:translateY(-10px)}100%{transform:none}}
.shake{animation:shake .55s}
@keyframes shake{20%{transform:rotate(-4deg)}45%{transform:rotate(4deg)}70%{transform:rotate(-2deg)}}
.knob.turn{animation:turn .6s}@keyframes turn{to{transform:rotate(360deg)}}
.got{animation:pop .38s backwards;background:var(--surface)}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.ball.drop,.shake,.knob.turn,.got{animation:none}}
.chatbtn{right:auto;left:16px}
.chatbar{position:absolute;left:80px;right:80px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;background:var(--surface);padding:6px;border-radius:14px;box-shadow:var(--shadow);z-index:2}
.say{position:absolute;transform:translate(-50%,-100%);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:12px;font-weight:700;font-size:14px;max-width:210px;text-align:center;overflow-wrap:anywhere;box-shadow:var(--shadow);pointer-events:none;z-index:1}
.lookwrap{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:14px;align-items:start}
.lookopts{display:flex;flex-direction:column;gap:18px;min-width:0}
.lookpv{position:sticky;top:0;display:flex;flex-direction:column;gap:6px;align-items:stretch;padding-bottom:8px;background:var(--surface)}
.lookpv canvas{width:108px;height:184px;background:var(--surface-2);border-radius:12px}
.lookpv .field{max-width:none;width:100%}
.lookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.lk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 3px;border:2px solid transparent;border-radius:10px;background:var(--bg);font-size:12px;font-weight:700;min-width:0}
.lk img{width:40px;height:68px}
.lk[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2)}
.lk:disabled{cursor:not-allowed}
.emo{font-size:26px;line-height:1;flex:none}
.bob{animation:bob .6s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}
.cookbox{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:var(--sun);color:var(--sun-ink)}
.cookbar{animation:fill 4s linear forwards;width:0}@keyframes fill{to{width:100%}}
.news{margin:0;padding:8px 12px;border-radius:10px;background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:13px}
.stk{flex-wrap:wrap}.stkb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}.stkb .btn{padding:6px 0;white-space:nowrap}.stkr{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
.modal{background-color:var(--bg);background-image:radial-gradient(var(--line) 1.2px,transparent 1.4px);background-size:14px 14px;border:3px solid var(--outline);box-shadow:0 6px 0 var(--outline);border-radius:18px}
.mhead{padding:10px 10px 0}
.x{border:2px solid var(--outline);background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 var(--outline)}
#panel h2{display:inline-block;background:var(--accent);color:var(--on-accent);padding:4px 14px;border-radius:999px;border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline);font-size:17px;margin-bottom:4px}
#panel h3{color:var(--ink);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
#panel h3::before{content:"";width:8px;height:8px;background:var(--accent);border:2px solid var(--outline);transform:rotate(45deg)}
.item,.card,.post,.gm,.lk,.cookbox{background-color:var(--surface);border:2px solid var(--outline-soft);box-shadow:0 3px 0 var(--outline-soft)}
.item.done{background:var(--surface-2)}
.lk[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--accent-strong);box-shadow:0 3px 0 var(--accent-strong)}
.btn{border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.btn:disabled{box-shadow:0 3px 0 var(--outline-soft);border-color:var(--outline-soft)}
.opt{border:2px solid var(--outline-soft);background:var(--surface)}
.field{border:2px solid var(--outline-soft);background:var(--surface)}
.cookbox{background:var(--sun)}
.news{border:2px solid var(--outline-soft)}
.stat{border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline)}
.menu,.dock .in,.actbtn,.story i,.story img{border:2px solid var(--outline)!important;box-shadow:0 3px 0 var(--outline)}
.stat.buff{background:var(--surface);color:var(--ink);font-size:12px}.stat.buff b{font-size:13px}
.toast{border:2px solid var(--outline)}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;z-index:1}
.tag b{background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;padding:3px 10px;letter-spacing:.02em;box-shadow:0 2px 6px rgba(0,0,0,.15);border-radius:99px;white-space:nowrap}
.tag i{font-style:normal;font-weight:400;margin-left:4px;opacity:.7}
.tag span{order:-1;background:var(--surface);color:var(--ink);border:2px solid var(--outline);border-radius:12px;padding:4px 10px;font-weight:700;font-size:13px;max-width:200px;text-align:center}
.pokes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.giftbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.handchip{position:absolute;left:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;background:var(--sun);color:var(--sun-ink);border:2px solid var(--outline);box-shadow:0 3px 0 var(--outline);border-radius:12px;padding:5px 6px 5px 10px;font-weight:700;font-size:13px;z-index:1}
.handchip button{border:2px solid var(--outline);background:var(--surface);border-radius:8px;padding:3px 8px;font-weight:700;font-size:12px}
.rar.r4{background:#e8a04a;color:#3a2410}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:var(--surface);border:2px solid var(--outline-soft);box-shadow:0 3px 0 var(--outline-soft);text-align:center;font-size:12px}
.day .name{font-size:12px}.day.got{opacity:.5}.day.got .emo::after{content:" ✓"}.day.now{border-color:var(--accent-strong);background:var(--sun);box-shadow:0 3px 0 var(--accent-strong);animation:bob .6s ease-in-out infinite alternate}

.idk{display:inline-block;padding:0 6px;border-radius:6px;font-weight:900}
/* 角色頁 */
.avcard{background:var(--surface);border-radius:28px;padding:14px 14px 18px;display:flex;flex-direction:column;gap:10px}
.avname{border:0;background:var(--surface-2);border-radius:18px;text-align:center;font-size:24px;font-weight:900;padding:12px;width:100%;color:var(--ink)}
.avstage{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 0;background:radial-gradient(circle at 50% 45%,var(--lav) 0,var(--lav) 38%,transparent 39%)}
.avstage canvas{width:100px;height:170px}
.dice{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;border-radius:14px;background:var(--sun);box-shadow:0 3px 0 var(--sun-edge);font-size:22px;padding:0}
.avbd{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:16px;padding:6px 12px}
.avtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.avtabs button{flex:none;width:64px;border:2px solid transparent;background:var(--surface);border-radius:18px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.avtabs button i{font-style:normal;font-size:24px}.avtabs button.on{border-color:var(--accent);color:var(--ink);background:var(--surface-2)}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avc{position:relative;border:3px solid transparent;background:var(--surface);border-radius:20px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink);min-width:0;cursor:pointer}
.avc img{width:44px;height:75px}.avc span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avc.on{border-color:var(--accent);background:var(--surface-2)}
.avc .ck{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;border:3px solid var(--bg)}
.avc .lock{position:absolute;right:6px;top:6px;font-size:14px}
.avc:disabled{background:var(--surface-2);cursor:not-allowed}
.avc.pick i,.avc.add i{width:44px;height:44px;margin:15px 0 16px;border-radius:50%;background:conic-gradient(#f08a7a,#f6d860,#8fbf7a,#9fe0c0,#b48ad8,#f08a7a);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:22px;color:var(--accent-edge)}
.avc.add i{background:var(--lav)}
.avc.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
/* 設定頁 */
.sgroup{background:var(--surface);border-radius:var(--r);overflow:hidden}
.srow{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:transparent;text-align:left;color:var(--ink);position:relative;flex-wrap:wrap}
.srow+.srow::before{content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--line)}
.sic{width:30px;font-size:22px;text-align:center;flex:none}
.stx{flex:1;min-width:0;display:flex;flex-direction:column}.stx b{font-size:17px}.stx small{color:var(--muted);font-size:13px}
.chev{color:var(--muted);font-size:24px;line-height:1}
.srow.col .seg{flex-basis:100%;margin-left:42px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--soft-edge)}
.tg{width:54px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0;transition:background .15s}
.tg i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.tg.on{background:var(--accent)}.tg.on i{left:25px}
/* 看動態、拍照：改成淡色可愛的畫面 */
.sv{background:linear-gradient(180deg,#efe6f9 0%,#f6efd8 55%,#e6f2dc 100%)!important}
.svin{color:var(--ink)}
.svbar i{background:rgba(42,53,36,.14)}.svbar b{background:var(--accent)}
.svx{background:var(--surface)!important;color:var(--ink)!important;width:46px;height:46px;box-shadow:0 3px 0 var(--soft-edge)}
.svx.pinon{background:var(--sun)!important}
.svimg img{border-radius:22px;box-shadow:0 8px 24px rgba(60,50,80,.15)}
.svre .re{background:var(--surface);color:var(--ink)}.svre .re[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink)}
.svform{background:var(--surface)!important}.svform .field{color:var(--ink)!important}.svform .field::placeholder{color:var(--muted)!important}
.svhead span{color:var(--muted);opacity:1}
.cmptabs button{color:var(--muted)}.cmptabs button.on{background:var(--sun);color:var(--sun-ink)}
.gal{border:0;background:var(--surface);box-shadow:0 3px 0 var(--soft-edge)}
.shutter{border-color:var(--surface);background:var(--pink);box-shadow:0 0 0 4px var(--lav-edge),0 4px 0 6px rgba(0,0,0,.05)}
.cmp .field{background:var(--surface)!important;color:var(--ink)!important;border:0!important}.cmp .field::placeholder{color:var(--muted)!important}
.cptag{border-color:var(--lav-edge);color:var(--lav-ink)}.cptag.on{background:var(--lav);border-color:var(--lav);color:var(--lav-ink)}
.tagpick{background:rgba(60,50,80,.3)}
.tpbox{background:var(--bg);color:var(--ink);border-radius:28px 28px 0 0}
.tprow{background:var(--surface);color:var(--ink)}.tprow b{border-color:var(--line)}.tprow.on{border-color:var(--accent)}.tprow.on b{background:var(--accent);border-color:var(--accent);color:#fff}
.camerr{color:var(--ink)}
/* 畫畫工作室 */
.dtabs{display:flex;background:var(--surface);border-radius:999px;padding:5px;gap:4px}
.dtabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px;font-weight:900;font-size:15px;color:var(--muted)}
.dtabs button.on{background:var(--lav);color:var(--lav-ink)}
.dwrap{display:flex;gap:12px;align-items:flex-start;justify-content:center}
.dcv{border-radius:14px;touch-action:none;image-rendering:pixelated;box-shadow:0 0 0 4px var(--surface);max-width:calc(100% - 92px);height:auto;cursor:crosshair}
.dside{display:flex;flex-direction:column;align-items:center;gap:4px}
.dpv{width:80px;height:auto;image-rendering:pixelated;background:var(--surface);border-radius:16px;padding:6px}
.dpal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;justify-items:center}
.dtools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dtools button{border:0;background:var(--surface);border-radius:16px;padding:8px 2px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.dtools button i{font-style:normal;font-size:20px}.dtools button.on{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 var(--sun-edge)}
/* ===== Peeps 風排版：全螢幕面板、大圓角卡片、立體按鈕；淡綠＋淡黃＋淡紫＋淡粉 ===== */
:root{--bg:#eef5e6;--surface:#fdfef9;--surface-2:#e4eed9;--line:#d6e3c8;--ink:#2a3524;--muted:#6c7a62;
  --accent:#74b05e;--accent-strong:#5a9446;--accent-edge:#4f853d;--on-accent:#fff;
  --sun:#f8e7a2;--sun-ink:#5b4a10;--sun-edge:#dcc265;
  --lav:#ece4f7;--lav-ink:#5a4a7a;--lav-edge:#cbbbe4;
  --pink:#fbe3e6;--pink-ink:#8a4652;--pink-edge:#ecbcc4;
  --soft-edge:#cddcbd;--r:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2219;--surface:#272f23;--surface-2:#313b2c;--line:#3c4836;--ink:#ecf2e2;--muted:#a6b499;
  --accent:#86c06f;--accent-strong:#9dd286;--accent-edge:#5b8c48;--on-accent:#13210d;--sun:#5a5124;--sun-ink:#f7eab0;--sun-edge:#3e3816;
  --lav:#3a3348;--lav-ink:#e2d6f5;--lav-edge:#2a2436;--pink:#47323a;--pink-ink:#f6d3da;--pink-edge:#33232a;--soft-edge:#1a2017}}
:root[data-theme="dark"]{--bg:#1c2219;--surface:#272f23;--surface-2:#313b2c;--line:#3c4836;--ink:#ecf2e2;--muted:#a6b499;
  --accent:#86c06f;--accent-strong:#9dd286;--accent-edge:#5b8c48;--on-accent:#13210d;--sun:#5a5124;--sun-ink:#f7eab0;--sun-edge:#3e3816;
  --lav:#3a3348;--lav-ink:#e2d6f5;--lav-edge:#2a2436;--pink:#47323a;--pink-ink:#f6d3da;--pink-edge:#33232a;--soft-edge:#1a2017}
body{font-size:16px}
/* 面板＝整頁 */
.veil{padding:0;background:rgba(30,40,26,.35)}
.modal{max-width:560px;height:100%;max-height:none;border:0!important;border-radius:0;box-shadow:none!important;background:var(--bg)!important;background-image:none!important}
@media (min-width:600px){.veil{padding:20px}.modal{border-radius:28px;box-shadow:0 20px 60px rgba(30,40,26,.25)!important}}
.mhead{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px}
.mtitle{grid-column:2;text-align:center;font-size:21px;font-weight:900;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{grid-column:1;grid-row:1;width:48px;height:48px;border:0!important;border-radius:50%;background:var(--surface-2)!important;color:var(--ink)!important;box-shadow:none!important;font-size:18px}
#panel{padding:4px 16px 28px;gap:22px}
#panel h2{display:block;background:none;color:var(--ink);padding:0;border:0;box-shadow:none;font-size:20px;margin:0}
#panel h3{color:var(--muted);font-size:14px;font-weight:700;letter-spacing:0;padding-left:6px}
#panel h3::before{display:none}
.lead{font-size:14px;line-height:1.6;padding:0 4px}
.sec{gap:12px}
/* 清單＝分組圓角框＋內縮分隔線 */
.list{gap:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.list .item{background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0;padding:14px 16px;position:relative}
.list .item+.item::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.list .item.done{opacity:.6}
.item{background:var(--surface);border:0!important;box-shadow:none!important;border-radius:var(--r);padding:14px 16px}
.item .name{font-size:16px}
/* 卡片 */
.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card,.post,.gm,.lk,.cookbox,.ent,.cdn,.day,.pincm{border:0!important;box-shadow:none!important;border-radius:var(--r)}
.card{background:var(--surface);padding:18px 10px 14px;gap:8px}
.card img{height:64px}.card .name{font-size:16px;font-weight:900}
.lk{background:var(--surface);border:2px solid transparent!important;border-radius:18px}
.lk[aria-pressed="true"]{border-color:var(--accent)!important;background:var(--surface-2)}
.post{background:var(--surface);padding:14px}
.gm{background:var(--surface)}
.day{background:var(--surface)}.day.now{background:var(--sun);border:2px solid var(--sun-edge)!important}
/* 按鈕：實心＋下緣立體 */
.btn{border:0!important;border-radius:16px;padding:11px 18px;font-size:15px;box-shadow:0 4px 0 var(--accent-edge)!important;transition:transform .06s,box-shadow .06s}
.btn:hover{background:var(--accent)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-edge)!important}
.btn.soft{background:var(--surface-2);color:var(--ink);box-shadow:0 4px 0 var(--soft-edge)!important}
.btn.soft:active:not(:disabled){box-shadow:0 1px 0 var(--soft-edge)!important}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-edge)!important}
.btn.small{padding:8px 13px;font-size:14px;border-radius:13px;box-shadow:0 3px 0 var(--accent-edge)!important}
.btn.soft.small{box-shadow:0 3px 0 var(--soft-edge)!important}.btn.sun.small{box-shadow:0 3px 0 var(--sun-edge)!important}
.btn:disabled{opacity:.45;box-shadow:0 3px 0 var(--soft-edge)!important}
.bigbtn{width:100%;font-size:19px;padding:15px 20px;border-radius:20px}
.opt{border:2px solid transparent!important;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:none!important}
.opt[aria-pressed="true"]{border-color:var(--accent)!important;background:var(--surface-2)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface)}
.sw[aria-pressed="true"],.sw.pick.on{border-color:var(--surface);box-shadow:0 0 0 3px var(--accent)}
/* 輸入框 */
.field{border:0!important;background:var(--surface);border-radius:14px;padding:11px 14px;font-size:16px;max-width:220px}
select.field{appearance:auto}
/* 浮在畫面上的圓形按鈕 */
.menu,.shotbtn{border:0!important;background:var(--surface)!important;box-shadow:0 4px 0 var(--soft-edge),0 6px 16px rgba(30,40,26,.12)!important;color:var(--ink)}
.menu{width:58px;height:58px;font-size:14px}
.shotbtn{width:46px;height:46px}
.actbtn{border:0!important;box-shadow:0 5px 0 var(--accent-edge),0 8px 20px rgba(30,40,26,.15)!important}
.hudr b{border-color:var(--surface);background:#e98a99}
.stat{border:0!important;box-shadow:0 3px 0 var(--soft-edge)!important;background:var(--surface);padding:6px 14px}
.stat.coin{background:var(--sun);box-shadow:0 3px 0 var(--sun-edge)!important}
.handchip{border:0!important;box-shadow:0 4px 0 var(--sun-edge)!important;border-radius:16px}.handchip button{border:0;border-radius:10px}
.toast{border:0!important;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.tag span{border:0;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.say{border-radius:16px}
/* 選單：Peeps 遊戲頁那種大方塊，四種淡色輪流 */
.dock .in{border:0!important;box-shadow:0 10px 30px rgba(30,40,26,.18)!important;border-radius:24px;background:var(--surface);padding:10px;gap:8px}
.dock.pop .in{grid-template-columns:repeat(15,minmax(0,1fr));width:min(370px,calc(100vw - 32px))}.dock.pop button{grid-column:span 3;min-width:0;font-size:13px!important;padding:10px 2px 8px!important}.dock.pop button.em{grid-column:span 5;flex-direction:row;justify-content:center;gap:6px}.dock.pop button.em i{font-size:20px}
.dock.pop button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border-radius:18px;font-size:14px;font-weight:900;color:var(--ink)}
.dock.pop button i{font-style:normal;font-size:26px;line-height:1}
.dock.pop button:nth-child(4n+1){background:var(--surface-2);box-shadow:0 3px 0 var(--soft-edge)}
.dock.pop button:nth-child(4n+2){background:var(--sun);box-shadow:0 3px 0 var(--sun-edge)}
.dock.pop button:nth-child(4n+3){background:var(--lav);box-shadow:0 3px 0 var(--lav-edge)}
.dock.pop button:nth-child(4n){background:var(--pink);box-shadow:0 3px 0 var(--pink-edge)}
.dock.pop button:active{transform:translateY(2px);box-shadow:none}
.dock.pop .em{font-size:13px}
.dock:not(.pop) button{border-radius:14px;padding:10px 14px}
.dock button.main{box-shadow:0 3px 0 var(--accent-edge)}
/* 限時動態的圈：淡紫＋淡粉 */
.story img{box-shadow:0 0 0 3px var(--line)!important}
.story.un img{box-shadow:0 0 0 3px #d9c6f0,0 0 0 5px #f4c3cc!important}
.story span{background:var(--surface);border-radius:99px;padding:0 7px}
.story.newp i{box-shadow:0 0 0 3px var(--accent-edge)!important}
.plus{border:2px solid var(--surface);box-shadow:none}
/* 聊天：大圓泡泡＋膠囊輸入列＋圓形送出鍵 */
.chathead{background:var(--bg);padding:8px 0}
.bub{border:0!important;border-radius:22px;padding:10px 16px;background:var(--surface);font-size:16px}
.bub.me{background:var(--lav);color:var(--lav-ink);border-radius:22px}
.chatin,.chatbar,.svform{align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:6px 6px 6px 8px}
.chatin{position:sticky;bottom:0;box-shadow:0 -8px 16px var(--bg)}
.chatbar{border:0;box-shadow:0 6px 20px rgba(30,40,26,.15)}
.chatin .field,.chatbar .field{background:transparent;padding:10px 6px}
.chatin [data-send],.chatbar [data-send],.svform [data-send]{width:44px;height:44px;flex:none;padding:0!important;border-radius:50%!important;font-size:0!important;position:relative}
.chatin [data-send]::after,.chatbar [data-send]::after,.svform [data-send]::after{content:"↑";font-size:21px;font-weight:900;position:absolute;inset:0;display:grid;place-items:center}
.chatin .btn.soft{border-radius:50%;width:40px;height:40px;padding:0;box-shadow:none!important}
.svform{background:rgba(255,255,255,.12)}.svform .field{background:transparent;border:0}
#noteform{background:var(--surface);border-radius:999px;padding:6px}#noteform .field{background:transparent}
/* 其他區塊 */
.news{border:0!important;border-radius:16px;background:var(--lav);color:var(--lav-ink)}
.note{border:0!important;box-shadow:0 3px 8px rgba(0,0,0,.08)!important;border-radius:14px}
.note.n2{background:#ece4f7}
.cd{border:0!important;border-radius:12px}.cd.td{box-shadow:0 0 0 3px var(--accent)}.cd.sel{box-shadow:0 0 0 3px var(--lav-edge)}
.mem{border:0!important;box-shadow:0 3px 0 var(--sun-edge)!important;border-radius:18px}
.memgrid figure{border:0;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.dmrow.unread{background:var(--pink)!important}
.dot{background:#e98a99}
.rar.r2{background:var(--sun)}.rar.r3{background:var(--lav);color:var(--lav-ink)}
.lookpv{background:var(--bg)}.lookpv canvas{background:var(--surface);border-radius:22px}
.tabs{background:var(--surface);border-radius:999px;padding:5px;gap:2px}
.tab{border-radius:999px;padding:9px 16px}.tab[aria-selected="true"]{background:var(--surface-2);box-shadow:none}
.pondv{border:0}.fbar{border:0}
.gmbase{background:var(--accent)}
#panel{flex:1}#panel .chat{flex:1 0 auto}
.hud{padding-right:76px}
.chathead b{display:none}
.ngbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 8px 6px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(60,50,80,.18);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden}
.ngbar[hidden]{display:none}
.ngpl{display:flex;flex-wrap:wrap;gap:8px}.ngchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:99px;padding:4px 12px 4px 4px;font-weight:700;font-size:14px}.ngchip img{width:26px;height:26px;border-radius:50%;background:var(--surface)}.ngchip.me{background:var(--lav)}.ngchip b{color:var(--accent-edge,#4f8a3c)}
.ngend{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;background:var(--sun);border-radius:20px}.ngend .emo{font-size:46px}.ngend b{font-size:20px}
.ngcv{width:100%;max-width:320px;aspect-ratio:1;align-self:center;border-radius:18px;background:#fffdf6;box-shadow:inset 0 0 0 2px var(--outline,#e4e0cc);touch-action:none;display:flex;align-items:center;justify-content:center;overflow:hidden}.ngcv img{width:100%;height:100%;object-fit:contain}
.ngtools{justify-content:center;gap:6px}.ngcol{width:30px;height:30px;border-radius:50%;border:3px solid transparent;font-size:14px;background:var(--bg);padding:0}.ngcol.on{border-color:var(--ink)}
.nggl{display:flex;flex-direction:column;gap:4px;font-size:14px}.nggl span{background:var(--bg);border-radius:12px;padding:4px 10px}.nggl .ok{background:var(--pink,#fbe0e8);font-weight:700}.ngword{background:var(--sun);padding:2px 10px;border-radius:8px}

/* ========== 小遊戲 ========== */
function quitGame(){clearTimeout(mg.timer);mg={id:null,bet:mg.bet}}
function startGame(id){clearTimeout(mg.timer);if(S.coins<mg.bet)return toast('金幣不夠下注');const bet=mg.bet;
  mg={id,bet,over:false,msg:'',st:'idle',n:0};
  if(id==='ttt')mg.b=Array(9).fill(0);
  if(id==='gmk')mg.b=Array.from({length:11},()=>Array(11).fill(0));
  render()}
const RPS={rock:['✊','石頭'],scissors:['✌️','剪刀'],paper:['✋','布']},oppName=()=>bot0()?bot0().name:'電腦';
function rpsMove(k){if(mg.over)return;const ks=Object.keys(RPS),o=ks[rnd(3)];mg.me=k;mg.op=o;const w=(k==='rock'&&o==='scissors')||(k==='scissors'&&o==='paper')||(k==='paper'&&o==='rock');finish(k===o?'draw':w?'win':'lose')}
function finish(r){if((mg.duo||mg.id==='rps')&&bot0())peerSay(bot0(),r==='win'?'可惡，下次再來！':r==='lose'?'嘿嘿，我贏了～':'平手！再一局？');mg.over=true;mg.msg=r==='win'?`你贏了，+${mg.bet} 金幣`:r==='lose'?`輸了，-${mg.bet} 金幣`:'平手，金幣不變';act('settle',{delta:r==='win'?mg.bet:r==='lose'?-mg.bet:0})}
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const tttWin=(b,p)=>LINES.some(l=>l.every(i=>b[i]===p));
function tttMove(i){const b=mg.b;if(mg.over||b[i])return;b[i]=1;if(tttWin(b,1))return finish('win');
  const free=()=>b.map((v,j)=>v?-1:j).filter(j=>j>=0);if(!free().length)return finish('draw');
  const tryP=p=>free().find(j=>{b[j]=p;const w=tttWin(b,p);b[j]=0;return w});
  let m=tryP(2);if(m===undefined)m=tryP(1);if(m===undefined)m=!b[4]&&Math.random()<.7?4:free()[rnd(free().length)];
  b[m]=2;if(tttWin(b,2))return finish('lose');if(!free().length)return finish('draw');render()}
const D4=[[1,0],[0,1],[1,1],[1,-1]];
function gmkScore(b,x,y,p){let s=0,five=false;for(const[dx,dy]of D4){let n=1,open=0;for(const sg of[1,-1]){let i=1;while((b[y+dy*i*sg]||[])[x+dx*i*sg]===p){n++;i++}if((b[y+dy*i*sg]||[])[x+dx*i*sg]===0)open++}
  if(n>=5)five=true;s+=n>=5?1e6:n===4?(open===2?1e4:open?1200:0):n===3?(open===2?900:open?90:0):n===2?(open===2?60:open?8:0):open}return{s,five}}
function gmkMove(x,y){const b=mg.b;if(mg.over||b[y][x])return;if(gmkScore(b,x,y,1).five){b[y][x]=1;return finish('win')}b[y][x]=1;
  let best=null,bs=-1;for(let j=0;j<11;j++)for(let i=0;i<11;i++){if(b[j][i])continue;const s=gmkScore(b,i,j,2).s+gmkScore(b,i,j,1).s*.9+Math.random();if(s>bs){bs=s;best=[i,j]}}
  if(!best)return finish('draw');const five=gmkScore(b,best[0],best[1],2).five;b[best[1]][best[0]]=2;if(five)return finish('lose');render()}
function reactTap(){if(mg.over)return;if(mg.st==='idle'){mg.st='wait';mg.timer=setTimeout(()=>{mg.st='go';mg.t0=performance.now();render()},1200+Math.random()*2300);return render()}
  if(mg.st==='wait'){clearTimeout(mg.timer);mg.st='end';mg.ms=0;return finish('lose')}
  if(mg.st==='go'){mg.ms=Math.round(performance.now()-mg.t0);mg.st='end';finish(mg.ms<=400?'win':'lose')}}
function tapTap(){if(mg.over)return;if(mg.st==='idle'){mg.st='run';mg.n=1;mg.timer=setTimeout(()=>{mg.st='end';finish(mg.n>=28?'win':'lose')},5000);return render()}
  if(mg.st==='run'){mg.n++;const p=document.querySelector('.pad');if(p)p.textContent=mg.n+' 下'}}
