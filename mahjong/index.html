<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麻將算錢</title>
<meta name="theme-color" content="#1E5A48" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻將算錢">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F2E8; --card:#FFFFFF; --ink:#23211D; --muted:#8A847A; --line:#E6DFD1;
  --accent:#1E5A48; --accent-ink:#FFFFFF; --gold:#A87A2A; --dealer:#EE8A1B;
  --win:#1E7A52; --lose:#C0392B; --shadow:0 2px 0 rgba(0,0,0,.04),0 6px 16px rgba(60,45,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121513; --card:#1E2320; --ink:#EDE8DC; --muted:#99A19B; --line:#313833;
    --accent:#3E9C7D; --accent-ink:#0E1210; --gold:#E0B454; --dealer:#F29B38;
    --win:#56C891; --lose:#F07A6E; --shadow:0 2px 0 rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121513; --card:#1E2320; --ink:#EDE8DC; --muted:#99A19B; --line:#313833;
  --accent:#3E9C7D; --accent-ink:#0E1210; --gold:#E0B454; --dealer:#F29B38;
  --win:#56C891; --lose:#F07A6E; --shadow:0 2px 0 rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.pageh{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.pageh h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:24px;margin:0}

/* 工具列 */
.toolbar{display:grid;grid-template-columns:repeat(6,1fr);padding:14px 0 6px}
.cloudon{color:var(--accent)!important}
.cloudcode{font-family:"Noto Serif TC",serif;font-weight:700;letter-spacing:.14em;font-size:26px;text-align:center;background:var(--bg);border-radius:12px;padding:14px;margin:12px 0}
.cloudlist{list-style:none;margin:8px 0 0;padding:0}
.cloudlist li{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.cloudlist li:first-child{border-top:0}
.cloudlist li .c{font-family:"Noto Serif TC",serif;font-weight:700;letter-spacing:.1em}
.cloudlist li .g{flex:1;color:var(--muted);font-size:13px;min-width:0}
.toolbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:6px 0;color:var(--ink)}
.toolbar button:disabled{opacity:.35}
.toolbar svg{width:26px;height:26px}
.info{font-size:13px;color:var(--muted);text-align:center}

/* 十字牌桌 */
.cross{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:". top ." "left mid right" ". bottom .";gap:10px;margin-top:10px;align-items:center}
.seat{border:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;min-height:150px;justify-content:center;position:relative;color:var(--ink)}
.seat:active{transform:scale(.97)}
.seat .nm{font-size:16px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.seat .mo{font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.seat .badge-d{position:absolute;top:10px;left:10px;background:var(--dealer);color:#fff;font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;border-radius:7px;padding:0 6px}
.seat .streak{position:absolute;top:10px;right:10px;font-size:12px;color:var(--dealer);font-weight:700}
.s0{grid-area:bottom}.s1{grid-area:right}.s2{grid-area:top}.s3{grid-area:left}
.mid{grid-area:mid;display:flex;flex-direction:column;align-items:center;gap:8px}
.wind{border:0;background:none;color:var(--gold);font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;white-space:nowrap}
.pill{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:9px 0;width:100%;font-size:16px}
.textbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 0}

.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:34px;line-height:1;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:28px;height:28px;font-size:22px}
.av.md{width:36px;height:36px;font-size:28px}
.av.lg{width:64px;height:64px;font-size:50px}
.pos{color:var(--win)} .neg{color:var(--lose)} .zero{color:var(--ink)}

section.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-top:14px}
h2{font-size:17px;margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.label{font-size:14px;color:var(--muted);margin:14px 0 6px}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pick button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick button .big{font-size:24px;line-height:28px;font-family:"Noto Serif TC",serif;font-weight:900}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:24px}
.stepper input{width:80px;height:48px;text-align:center;font-weight:700;font-size:26px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{border:0;background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
.preview{margin-top:14px;border-top:1px dashed var(--line);padding-top:8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.prow input{width:110px;text-align:right;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums;font-weight:700}
.prow input.edited{border-color:var(--gold)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.warn{font-size:13px;color:var(--lose);margin:6px 0 0;font-weight:700}
.primary{width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.primary:disabled{opacity:.4}
.primary.small{width:auto;margin:0;padding:10px 20px;font-size:16px}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* 紀錄 */
.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.hist li:first-child{border-top:0}
.hist .h1{display:flex;justify-content:space-between;gap:8px}
.hist .amts{color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.dayhead{font-weight:700;font-size:15px;margin:16px 0 2px;display:flex;justify-content:space-between}
.dayhead:first-child{margin-top:0}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.empty{color:var(--muted);font-size:14px}

/* 戰績 */
.range{display:flex;gap:8px;margin-top:10px;align-items:center}
.range input{flex:1;min-width:0;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.summary div{background:var(--bg);border-radius:12px;padding:8px 4px}
.summary b{display:block;font-size:22px;line-height:1.2}
.summary span{font-size:12px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:13px;display:flex;align-items:center;gap:6px}
.ppills{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px}
.ppills button{flex:none;border:0;background:transparent;border-radius:16px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;min-width:68px;color:var(--muted)}
.ppills button[aria-pressed="true"]{background:var(--bg);color:var(--gold);font-weight:700}
.phead{display:flex;align-items:center;gap:12px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.phead .n{flex:1;font-size:20px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .m{font-size:34px;font-weight:500;font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;text-align:center}
.grid4 div{font-size:13px;color:var(--muted);line-height:1.3}
.grid4 b{display:block;font-size:26px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.grid4 b small{font-size:14px}
.radarbox{display:flex;justify-content:center;margin-top:10px}
.radarbox svg{width:100%;max-width:320px;height:auto}
.rank li{display:flex;align-items:center;gap:10px}
.rank .n{flex:1}

/* 分數表 */
.htools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.htools select{flex:1;min-width:120px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.gscroll{overflow-x:auto;margin:12px -14px 0;padding:0 14px}
.grid{display:grid;min-width:100%}
.grid .c{padding:10px 2px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px;border-top:1px solid var(--line);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grid .c.alt{background:var(--bg)}
.grid .hd{border-top:0;padding:4px 2px 8px;gap:2px}
.grid .hd .nm{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid .hd .tot{font-size:20px;font-weight:700}
.grid .side{border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;cursor:pointer}
.grid .side.hd{cursor:default}
.tag{font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.tag.t-self{color:var(--gold)} .tag.t-discard{color:var(--accent)} .tag.t-draw{color:var(--muted)} .tag.t-manual{color:var(--muted)}
.wchip{font-size:11px;color:var(--gold);white-space:nowrap;font-weight:700}
.grid .c.zero0{color:var(--muted)}
.grid .c.winc{font-weight:700}
.grid .c .dd{position:absolute;top:3px;right:4px;font-size:10px;color:var(--dealer);font-weight:900}
.grid .c.na{color:var(--line)}
.grid .ev{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:left;padding:2px 6px 8px 50px}
.grid .row-tap{cursor:pointer}

/* 詳細戰績 */
.plist2 button{width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.plist2 button:first-of-type{border-top:0}
.plist2 .n{flex:1;min-width:0}
.plist2 .n small{display:block;color:var(--muted);font-size:12px}
.plist2 .m{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.plist2 .chev{color:var(--muted);font-size:20px}
.dhead{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.dhead .nav{display:flex;align-items:center;gap:22px}
.dhead .nav button{border:0;background:none;font-size:34px;color:var(--gold);padding:0 8px;line-height:1}
.dhead .av.xl{width:96px;height:96px;font-size:74px;border:3px solid var(--gold)}
.dhead .n{font-size:22px;font-weight:700}
.dhead .m{font-size:36px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.chip{background:var(--bg);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14px}
.chip span{color:var(--muted)}
.chip b{font-variant-numeric:tabular-nums;text-align:right}
.chip b small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.backbtn{border:0;background:none;color:var(--gold);font-size:16px;padding:0}

/* 走勢、對戰、年度 */
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}
table.vs{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.vs th,table.vs td{padding:6px 2px;text-align:center;border-bottom:1px solid var(--line);font-size:15px}
table.vs th{font-weight:400}
table.vs td.hot{background:var(--bg);color:var(--lose);font-weight:700;border-radius:8px}
table.vs td.self{color:var(--line)}
.linkcard{width:100%;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:14px;margin-top:14px;display:flex;align-items:center;gap:12px;text-align:left}
.linkcard .t{flex:1}
.linkcard .t small{display:block;color:var(--muted);font-size:13px}
.linkcard .big{font-size:30px}
.award{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.award:first-of-type{border-top:0}
.award .ic{font-size:30px;width:40px;text-align:center}
.award .t{flex:1;min-width:0}
.award .t small{display:block;color:var(--muted);font-size:13px}
.award .who{display:flex;flex-direction:column;align-items:center;font-size:13px;max-width:80px;text-align:center}
.shareimg{width:100%;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.jbtns{display:grid;gap:8px;margin-top:8px}

/* 玩家 */
.plist .prow{border-top:1px solid var(--line);padding:10px 0}
.plist .prow:first-child{border-top:0}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.emojis button{border:2px solid transparent;background:var(--bg);border-radius:12px;font-size:28px;padding:4px 0;line-height:1.3}
.emojis button[aria-pressed="true"]{border-color:var(--accent)}
.filebtn{position:relative;overflow:hidden;display:inline-block;margin-top:8px}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--gold);font-weight:700}

dialog{border:0;border-radius:20px;padding:0;width:min(94vw,480px);max-height:90vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:16px}
.dlg h2{display:flex;align-items:center;gap:8px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.field input[type=text],.field input[type=number],.field select{width:150px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.field input[type=checkbox]{width:22px;height:22px}
.sub{font-size:15px;margin:16px 0 4px;color:var(--muted)}
.settle li{padding:6px 0;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- 牌桌 -->
<div id="tab-table" class="wrap">
  <div class="toolbar">
    <button id="tbNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>新牌局</button>
    <button id="tbUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>還原</button>
    <button id="tbDealer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><text x="12" y="16.5" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" font-weight="900">莊</text></svg>莊家設定</button>
    <button id="tbSeats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V4M4 8l4-4 4 4"/><path d="M16 4v16M12 16l4 4 4-4"/></svg>換人/換位</button>
    <button id="tbSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>設定</button>
    <button id="tbCloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 19a4.5 4.5 0 01-.6-8.96A6 6 0 0117.7 9.3 3.85 3.85 0 0117.5 19z"/></svg>雲端</button>
  </div>
  <div class="info" id="roundInfo"></div>
  <div class="cross" id="cross"></div>
  <p class="hint">點胡牌的人來記這一局</p>
  <p class="hint" id="offseat" style="margin-top:4px"></p>
</div>

<!-- 戰績 -->
<div id="tab-stats" class="wrap" hidden>
  <div class="pageh"><h1>戰績</h1></div>
  <button class="linkcard" id="btnYear"><span class="big">🏆</span><span class="t"><strong>年度回顧</strong><small>今年的賭神、自摸王、放槍王</small></span><span class="chev">›</span></button>
  <section class="card">
    <div class="seg" role="group" aria-label="時間範圍">
      <button data-range="all" aria-pressed="true">總牌局</button>
      <button data-range="today" aria-pressed="false">今天</button>
      <button data-range="custom" aria-pressed="false">選時間</button>
    </div>
    <div class="range" id="rangeBox" hidden>
      <input type="date" id="rFrom" aria-label="開始日期"><span>到</span><input type="date" id="rTo" aria-label="結束日期">
    </div>
    <div id="statsSummary"></div>
  </section>

<script>
const WINDS=['東','南','西','北'];
const EMOJIS=['🐸','🐱','🐶','🐺','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐵','🐔','🐧','🐲','🐴','🦄','🐑','🐢','🐙'];
const KEY='mahjong-money-v2', OLDKEY='mahjong-money-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const DAY=86400000;
function fresh(){
  const players=[1,2,3,4].map((n,i)=>({id:uid(),name:'玩家'+n,avatar:EMOJIS[i]}));
  return {players,exPlayers:[],seats:players.map(p=>p.id),base:100,per:20,dealerTai:1,streakRule:true,dealer:0,streak:0,passes:0,theme:'auto',rounds:[],archive:[],started:Date.now()};
}
const $=id=>document.getElementById(id);
let S=load();
let ui={hview:'grid',horder:'asc',hscope:'session',tab:'table',winner:null,loser:null,tai:1,override:{},range:'all',from:'',to:'',statP:null};

function load(){
  let s=null;
  try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.players)s=Object.assign(fresh(),v);}catch(e){}
  if(!s){try{
    const o=JSON.parse(localStorage.getItem(OLDKEY));
    if(o&&o.names){
      s=fresh();
      s.players=o.names.map((n,i)=>({id:uid(),name:n,avatar:EMOJIS[i]}));s.seats=s.players.map(p=>p.id);
      ['base','per','dealerTai','streakRule','dealer','streak'].forEach(k=>{if(o[k]!==undefined)s[k]=o[k];});
      s.rounds=(o.rounds||[]).map(r=>{const a={};r.amounts.forEach((v,i)=>a[s.seats[i]]=v);return {desc:r.desc,amounts:a,seats:[...s.seats],type:'manual',snap:{dealer:r.snap.dealer,streak:r.snap.streak,seats:[...s.seats]}};});
    }
  }catch(e){}}
  if(!s)s=fresh();
  if(!Array.isArray(s.exPlayers))s.exPlayers=[];
  s.players.forEach((p,i)=>{if(!p.avatar)p.avatar=EMOJIS[i%EMOJIS.length];});
  s.rounds.forEach(r=>{if(!r.t)r.t=s.started||Date.now();});
  s.archive.forEach(a=>a.rounds.forEach(r=>{if(!r.t)r.t=a.started||a.ended||Date.now();}));
  return s;
}
function applyTheme(){
  if(S.theme==='light'||S.theme==='dark')document.documentElement.dataset.theme=S.theme;
  else delete document.documentElement.dataset.theme;
}
function ask(msg,yes='確定',alertOnly=false){
  return new Promise(res=>{
    $('askMsg').textContent=msg;$('askYes').textContent=yes;$('askNo').hidden=alertOnly;
    const d=$('dlgAsk');
    const done=v=>{$('askYes').onclick=$('askNo').onclick=null;d.onclose=null;d.close();res(v);};
    $('askYes').onclick=()=>done(true);$('askNo').onclick=()=>done(false);
    d.onclose=()=>res(false);
    d.showModal();
  });
}
const tell=msg=>ask(msg,'知道了',true);
let toastT;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));return true;}
  catch(e){tell('儲存失敗：手機空間不足，可以把照片頭像換成動物頭像試試。');return false;}
}
const fmt=n=>(n>0?'+':'')+n.toLocaleString('zh-TW');
const fmtPlain=n=>n.toLocaleString('zh-TW');
const cls=n=>n>0?'pos':n<0?'neg':'zero';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const player=id=>S.players.find(p=>p.id===id)||(S.exPlayers||[]).find(p=>p.id===id);
const pname=id=>{const p=player(id);return p?p.name:'?';};
const seatName=i=>pname(S.seats[i]);
function avHTML(id,size=''){
  const p=player(id);const a=p?p.avatar:'❔';
  const inner=a&&a.startsWith('data:')?`<img src="${a}" alt="">`:esc(a||'❔');
  return `<span class="av ${size}" aria-hidden="true">${inner}</span>`;
}
const allRounds=()=>S.archive.flatMap(a=>a.rounds).concat(S.rounds);
function totals(rounds){const t={};rounds.forEach(r=>{for(const id in r.amounts)t[id]=(t[id]||0)+r.amounts[id];});return t;}
function curDealerTai(){return S.dealerTai+(S.streakRule?2*S.streak:0);}
const windText=p=>`${WINDS[Math.floor(p/4)%4]}圈${WINDS[p%4]}風`;
const dayKey=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const dayLabel=k=>{const [y,m,d]=k.split('-');return `${y}/${+m}/${+d}`;};

// ---- 分頁 ----
function setTab(t){
  ui.tab=t;
  ['table','stats','statd','year','hist','players'].forEach(k=>{$('tab-'+k).hidden=k!==t;});
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===(t==='statd'||t==='year'?'stats':t)));
  window.scrollTo(0,0);renderTab();
}
function renderTab(){
  if(ui.tab==='table')renderTable();
  else if(ui.tab==='stats')renderStats();
  else if(ui.tab==='statd')renderStatDetail();
  else if(ui.tab==='year')renderYear();
  else if(ui.tab==='hist')renderHist();
  else renderPlayers();
}

// ---- 牌桌 ----
function moneySize(v){const len=fmtPlain(v).length;return len<=2?46:len<=4?38:len<=6?30:24;}
function renderTable(){
  const t=totals(S.rounds);
  $('cross').innerHTML=[0,1,2,3].map(i=>{const id=S.seats[i],v=t[id]||0;return `
    <button class="seat s${i}" data-seat-tap="${i}" aria-label="${esc(pname(id))} 胡牌，目前 ${v} 元">
      ${i===S.dealer?'<span class="badge-d">莊</span>':''}
      ${i===S.dealer&&S.streak>0?`<span class="streak">連${S.streak}</span>`:''}
      ${avHTML(id)}
      <span class="nm">${esc(pname(id))}</span>
      <span class="mo ${cls(v)}" style="font-size:${moneySize(v)}px">${fmtPlain(v)}</span>
    </button>`;}).join('')+`
    <div class="mid">
      <button class="wind" id="midWind">${windText(S.passes)} ›</button>
      <button class="pill" id="midDraw">流局</button>
      <button class="pill" id="midSettle">結算</button>
      <button class="textbtn" id="midManual">手動記帳</button>
    </div>`;
  const off=Object.keys(t).filter(id=>!S.seats.includes(id)&&t[id]!==0);
  $('offseat').textContent=off.length?'沒在桌上：'+off.map(id=>`${pname(id)} ${fmt(t[id])}`).join('、'):'';
  $('roundInfo').textContent=`本場第 ${S.rounds.length+1} 局，底 ${S.base}／台 ${S.per}`;
  $('tbUndo').disabled=!S.rounds.length;
  $('midWind').onclick=openDealer;
  $('midDraw').onclick=recordDraw;
  $('midSettle').onclick=openSettle;
  $('midManual').onclick=openManual;
}

function autoAmounts(){
  const a=[0,0,0,0];const w=ui.winner;
  const n=Math.max(0,parseInt(ui.tai)||0);
  const payers=ui.loser==='self'?[0,1,2,3].filter(i=>i!==w):(ui.loser==null?null:[ui.loser]);
  if(!payers)return null;
  payers.forEach(p=>{
    const extra=(w===S.dealer||p===S.dealer)?curDealerTai():0;
    const amt=S.base+S.per*(n+extra);
    a[p]-=amt;a[w]+=amt;
  });
  return a;
}
function currentAmounts(){
  const base=autoAmounts(); if(!base)return null;
  return base.map((v,i)=>ui.override[i]!==undefined&&ui.override[i]!==''?(parseInt(ui.override[i])||0):v);
}
function openWin(i){
  Object.assign(ui,{winner:i,loser:null,tai:1,override:{}});
  $('winTitle').innerHTML=`${avHTML(S.seats[i],'md')}${esc(seatName(i))} 胡牌`;
  renderWin();$('dlgWin').showModal();
}
function renderWin(){
  const w=ui.winner;
  $('pickLoser').innerHTML=`<button data-l="self" aria-pressed="${ui.loser==='self'}"><span class="big">摸</span><span>自摸</span></button>`+
    [0,1,2,3].filter(i=>i!==w).map(i=>`<button data-l="${i}" aria-pressed="${ui.loser===i}">${avHTML(S.seats[i],'sm')}<span>${esc(seatName(i))}</span></button>`).join('');
  $('tai').value=ui.tai;
  $('quickTai').innerHTML=[1,2,3,4,5,8,16].map(n=>`<button data-q="${n}">${n}台</button>`).join('');
  renderPreview();
}
function renderPreview(){
  const p=$('preview');const amts=currentAmounts();
  if(!amts){p.innerHTML='<p class="note">選擇自摸或放槍的人，就會算出金額。</p>';$('btnWinSave').disabled=true;return;}
  const sum=amts.reduce((a,b)=>a+b,0);
  p.innerHTML=[0,1,2,3].map(i=>`
    <div class="prow"><span class="who">${avHTML(S.seats[i],'sm')}${esc(seatName(i))}</span>
    <input type="number" inputmode="numeric" data-o="${i}" value="${amts[i]}" class="${ui.override[i]!==undefined?'edited':''}" aria-label="${esc(seatName(i))} 金額"></div>`).join('')
    +`<p class="note">莊家相關的付款另加 ${curDealerTai()} 台${S.streak?`（含連${S.streak}拉${S.streak}）`:''}。金額可直接改。</p>`
    +(sum!==0?`<p class="warn">四人加總是 ${fmt(sum)}，不等於 0。</p>`:'');
  $('btnWinSave').disabled=false;
}
function pushRound(rec,amounts,keeps){
  const snap={dealer:S.dealer,streak:S.streak,passes:S.passes,seats:[...S.seats]};
  const a={};S.seats.forEach((id,i)=>a[id]=amounts[i]);
  S.rounds.push(Object.assign(rec,{amounts:a,seats:[...S.seats],dealerId:S.seats[S.dealer],t:Date.now(),snap}));
  if(keeps)S.streak++;else{S.dealer=(S.dealer+1)%4;S.streak=0;S.passes++;}
  save();renderTab();
  if(!keeps&&S.passes%16===0){
    const t=totals(S.rounds);const lead=S.seats.slice().sort((a,b)=>(t[b]||0)-(t[a]||0))[0];
    $('jiangMsg').textContent=`東南西北四圈都打完了。目前領先的是 ${pname(lead)}（${fmt(t[lead]||0)}）。要換位子嗎？`;
    setTimeout(()=>$('dlgJiang').showModal(),300);
  }else if(!keeps&&S.passes%4===0){setTimeout(()=>toast(`進入${WINDS[Math.floor(S.passes/4)%4]}圈`),900);}
}
$('btnWinSave').onclick=async()=>{
  const amounts=currentAmounts(); if(!amounts)return;
  const sum=amounts.reduce((a,b)=>a+b,0);
  $('dlgWin').close();
  if(sum!==0&&!(await ask(`四人加總是 ${fmt(sum)}，確定要記下嗎？`,'照樣記下')))return;
  const self=ui.loser==='self';

function openSettle(){
  const t=totals(S.rounds);const cred=[],debt=[];
  for(const id in t){if(t[id]>0)cred.push([id,t[id]]);else if(t[id]<0)debt.push([id,-t[id]]);}
  cred.sort((a,b)=>b[1]-a[1]);debt.sort((a,b)=>b[1]-a[1]);
  const out=[];let c=0,d=0;
  while(c<cred.length&&d<debt.length){
    const x=Math.min(cred[c][1],debt[d][1]);
    out.push(`${esc(pname(debt[d][0]))} 付給 ${esc(pname(cred[c][0]))} <strong>${fmtPlain(x)}</strong> 元`);
    cred[c][1]-=x;debt[d][1]-=x;if(!cred[c][1])c++;if(!debt[d][1])d++;
  }
  $('settleList').innerHTML=out.length?out.map(s=>`<li>${s}</li>`).join(''):'<li class="empty">目前大家都是 0，不用付錢。</li>';
  $('shareBox').innerHTML='';

    const ids=Object.keys(t).sort((a,b)=>t[b]-t[a]);

    const plain=out.map(s=>s.replace(/<[^>]+>/g,''));

// ---- 戰績 ----
function roundsMeta(){ // 每局附上所屬場次與當天第幾局
  const out=[];let idx=0;
  S.archive.forEach(a=>a.rounds.forEach(r=>out.push({r,sid:a.started,i:idx++})));
  S.rounds.forEach(r=>out.push({r,sid:'cur',i:idx++}));
  const dayCount={};
  out.forEach(m=>{const k=dayKey(m.r.t);dayCount[k]=(dayCount[k]||0)+1;m.dayNo=dayCount[k];});
  return out;
}
const roundLabel=m=>{const d=new Date(m.r.t);return `${d.getMonth()+1}/${d.getDate()} 第${m.dayNo}局`;};
function filteredMeta(){
  const rs=roundsMeta();
  if(ui.range==='today'){const k=dayKey(Date.now());return rs.filter(m=>dayKey(m.r.t)===k);}
  if(ui.range==='custom'){
    const f=ui.from?new Date(ui.from+'T00:00:00').getTime():-Infinity;
    const to=ui.to?new Date(ui.to+'T00:00:00').getTime()+DAY:Infinity;
    return rs.filter(m=>m.r.t>=f&&m.r.t<to);
  }
  return rs;
}
function filteredRounds(){return filteredMeta().map(m=>m.r);}
function computeStats(metas){
  const st={};
  const g=id=>st[id]||(st[id]={played:0,statN:0,win:0,self:0,eat:0,discard:0,discardTai:0,beSelf:0,taiSum:0,eatTai:0,maxTai:0,maxTaiAt:'',money:0,
    bestGain:0,bestGainAt:'',worstLoss:0,worstLossAt:'',selfGain:0,selfLoss:0,eatGain:0,discardLoss:0,run:0,maxRun:0,dealerN:0,dealerKeep:0,sessions:{}});
  let prevWinner=null;
  metas.forEach(m=>{const r=m.r,lab=roundLabel(m);
    r.seats.forEach(id=>{const s=g(id),a=r.amounts[id]||0;s.played++;s.money+=a;if(r.type!=='manual')s.statN++;
      if(a>s.bestGain){s.bestGain=a;s.bestGainAt=lab;} if(a<s.worstLoss){s.worstLoss=a;s.worstLossAt=lab;}
      s.sessions[m.sid]=(s.sessions[m.sid]||0)+a;
      if(r.dealerId===id){s.dealerN++; if(r.type==='draw'||r.winner===id||(r.type==='manual'&&a>0))s.dealerKeep++;}
    });
    if(r.type==='self'||r.type==='discard'){
      const w=g(r.winner);w.win++;w.taiSum+=r.tai;if(r.tai>w.maxTai){w.maxTai=r.tai;w.maxTaiAt=lab;}
      w.run=prevWinner===r.winner?w.run+1:1;w.maxRun=Math.max(w.maxRun,w.run);
      r.seats.forEach(id=>{if(id!==r.winner)g(id).run=0;});
      prevWinner=r.winner;
      if(r.type==='self'){w.self++;w.selfGain+=r.amounts[r.winner]||0;r.seats.forEach(id=>{if(id!==r.winner){const o=g(id);o.beSelf++;o.selfLoss+=r.amounts[id]||0;}});}
      else{w.eat++;w.eatTai+=r.tai;w.eatGain+=r.amounts[r.winner]||0;const l=g(r.loser);l.discard++;l.discardTai+=r.tai;l.discardLoss+=r.amounts[r.loser]||0;}
    }else{r.seats.forEach(id=>g(id).run=0);prevWinner=null;}
  });
  // 場次：正分率、首名率
  const sids=[...new Set(metas.map(m=>m.sid))];
  Object.values(st).forEach(s=>{s.sessN=0;s.posN=0;s.firstN=0;});
  sids.forEach(sid=>{
    const inS=Object.keys(st).filter(id=>st[id].sessions[sid]!==undefined);
    if(!inS.length)return;
    const top=Math.max(...inS.map(id=>st[id].sessions[sid]));
    inS.forEach(id=>{const s=st[id],v=s.sessions[sid];s.sessN++;if(v>0)s.posN++;if(v===top&&top>0)s.firstN++;});
  });
  return st;
}
const clamp=v=>Math.max(0,Math.min(100,v));
function radarScores(s){
  const n=s.statN||0;
  if(!n)return [0,0,0,0,0];
  return [
    clamp(s.win/n/0.40*100),
    clamp(s.self/n/0.20*100),
    clamp(100-(s.discard/n)/0.30*100),
    clamp((s.win?s.taiSum/s.win:0)/8*100),
    clamp(100-(s.beSelf/n)/0.40*100)
  ];
}
function radarSVG(scores){
  const L=['進攻','手氣','防守','牌力','抗壓'];
  const cx=160,cy=150,R=100,N=5;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const poly=r=>Array.from({length:N},(_,i)=>pt(i,r).join(',')).join(' ');
  let g='';
  [1,.66,.33].forEach(k=>g+=`<polygon points="${poly(R*k)}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`);
  for(let i=0;i<N;i++){const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;}
  const data=scores.map((v,i)=>pt(i,Math.max(6,R*v/100)).join(',')).join(' ');
  g+=`<polygon points="${data}" fill="var(--gold)" fill-opacity=".22" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round"/>`;
  L.forEach((l,i)=>{const [x,y]=pt(i,R+26);g+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="var(--muted)">${l}</text><text x="${x}" y="${y+17}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--ink)" font-weight="700">${Math.round(scores[i])}</text>`;});
  return `<svg viewBox="0 0 320 310" role="img" aria-label="能力雷達圖：${L.map((l,i)=>l+Math.round(scores[i])).join('，')}">${g}</svg>`;
}
const pctN=(a,b)=>b?Math.round(a/b*100):0;
const rangeText=()=>ui.range==='today'?'今天':ui.range==='custom'?`${ui.from||'最早'} 到 ${ui.to||'現在'}`:'總牌局';
function renderStats(){
  document.querySelectorAll('[data-range]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.range===ui.range));

  }
  $('statsList').hidden=$('statsTrend').hidden=$('statsVs').hidden=false;

  const ids=Object.keys(st).filter(id=>!!player(id)).sort((a,b)=>st[b].money-st[a].money);
  const best=fn=>{let b=null;ids.forEach(id=>{const v=fn(id);if(v>0&&(b===null||v>b.v))b={id,v};});return b;};
  const hi=[];

  const dc=best(id=>st[id].statN?st[id].discard/st[id].statN:0); if(dc)hi.push([dc.id,'放槍最多']);
  const big=best(id=>st[id].maxTai); if(big)hi.push([big.id,`最大一把 ${big.v} 台`]);
  $('statsSummary').innerHTML=`
    <div class="summary">
      <div><b>${days}</b><span>天</span></div>
      <div><b>${metas.length}</b><span>局</span></div>
      <div><b>${pctN(draws,statRounds)}%</b><span>流局率</span></div>
    </div>
    <div class="badges">${hi.map(([id,t])=>`<span class="badge">${avHTML(id,'sm')}${esc(pname(id))}　${esc(t)}</span>`).join('')}</div>`;

  $('statsList').innerHTML=`<h2>點玩家看詳細戰績</h2>`+ids.map((id,k)=>{const s=st[id];return `
    <button data-sp="${id}">
      <span style="width:16px;color:var(--muted);font-size:14px">${k+1}</span>${avHTML(id,'md')}
      <span class="n"><strong>${esc(pname(id))}</strong><small>胡 ${pctN(s.win,s.statN)}%　摸 ${pctN(s.self,s.statN)}%　槍 ${pctN(s.discard,s.statN)}%</small></span>
      <span class="m ${cls(s.money)}">${fmt(s.money)}</span><span class="chev">›</span>
    </button>`;}).join('');
  renderTrend(metas,ids);renderVs(metas,ids);
}
const PALETTE=['#E0533D','#2E86DE','#27AE60','#F39C12','#8E44AD','#16A085','#D35400','#C2185B','#607D8B'];
function colorMap(){const m={};S.players.concat(S.exPlayers||[]).forEach((p,i)=>m[p.id]=PALETTE[i%PALETTE.length]);return m;}
function renderTrend(metas,ids){
  const col=colorMap();const N=metas.length;
  const cum={};ids.forEach(id=>cum[id]=[0]);
  metas.forEach(m=>ids.forEach(id=>{const arr=cum[id];arr.push(arr[arr.length-1]+(m.r.amounts[id]||0));}));
  let mn=0,mx=0;ids.forEach(id=>cum[id].forEach(v=>{mn=Math.min(mn,v);mx=Math.max(mx,v);}));
  if(mx===mn){mx+=1;}
  const W=340,H=210,L=44,R=8,T=10,B=24;
  const x=i=>L+(W-L-R)*(N?i/N:0);
  const y=v=>T+(H-T-B)*(mx-v)/(mx-mn);
  let g=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>`;
  [mx,mn].forEach(v=>{if(v!==0)g+=`<text x="${L-6}" y="${y(v)}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--muted)">${fmtPlain(Math.round(v))}</text>`;});
  g+=`<text x="${L-6}" y="${y(0)}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--muted)">0</text>`;
  g+=`<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">第1局</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">第${N}局</text>`;
  ids.slice().reverse().forEach(id=>{
    const pts=cum[id].map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${col[id]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last=cum[id][N];g+=`<circle cx="${x(N)}" cy="${y(last)}" r="3.5" fill="${col[id]}"/>`;
  });
  $('statsTrend').innerHTML=`<h2>輸贏走勢</h2><div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每個人累計輸贏的折線圖">${g}</svg></div>
    <div class="legend">${ids.map(id=>`<span><i style="background:${col[id]}"></i>${esc(pname(id))}</span>`).join('')}</div>`;
}
function vsCounts(metas){
  const dis={},selfBy={};
  metas.forEach(({r})=>{
    if(r.type==='discard'){(dis[r.loser]=dis[r.loser]||{})[r.winner]=((dis[r.loser]||{})[r.winner]||0)+1;}
    if(r.type==='self')r.seats.forEach(id=>{if(id!==r.winner){(selfBy[id]=selfBy[id]||{})[r.winner]=((selfBy[id]||{})[r.winner]||0)+1;}});
  });
  return {dis,selfBy};
}
function renderVs(metas,ids){
  const {dis}=vsCounts(metas);

  if(!any){$('statsVs').innerHTML='<h2>對戰關係</h2><p class="empty">還沒有人放槍，打幾局之後這裡會出現誰最常放槍給誰。</p>';return;}

    <div style="overflow-x:auto"><table class="vs"><thead><tr><th style="text-align:left;font-size:12px;color:var(--muted)">放槍↓　胡→</th>${ids.map(id=>`<th>${avHTML(id,'sm')}</th>`).join('')}</tr></thead>

// ---- 分享圖片 ----
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}
async function makeShareImage(title,sub,rows,lines){
  const css=getComputedStyle(document.documentElement);
  const v=k=>css.getPropertyValue(k).trim();
  const W=1080,rowH=150,lineH=62;
  const H=260+rows.length*rowH+(lines.length?60+lines.length*lineH:0)+110;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const font=w=>`${w} "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
  x.fillStyle=v('--bg');x.fillRect(0,0,W,H);
  x.fillStyle=v('--ink');x.font=font('900 68px');x.textAlign='center';x.fillText(title,W/2,120);
  x.fillStyle=v('--muted');x.font=font('400 38px');x.fillText(sub,W/2,185);
  let y=240;
  for(let k=0;k<rows.length;k++){
    const [id,money]=rows[k];
    x.fillStyle=v('--card');roundRect(x,50,y,W-100,rowH-20,32);x.fill();
    const cy=y+(rowH-20)/2;
    x.textAlign='left';x.fillStyle=v('--muted');x.font=font('700 44px');x.fillText(String(k+1),90,cy+15);
    const p=player(id);const a=p?p.avatar:'❔';
    if(a.startsWith('data:')){const im=await loadImg(a);if(im){x.save();x.beginPath();x.arc(210,cy,48,0,Math.PI*2);x.clip();x.drawImage(im,162,cy-48,96,96);x.restore();}}
    else{x.font='80px sans-serif';x.textAlign='center';x.fillText(a,210,cy+28);}
    x.textAlign='left';x.fillStyle=v('--ink');x.font=font('500 50px');x.fillText(pname(id),290,cy+17);
    x.textAlign='right';x.fillStyle=money>0?v('--win'):money<0?v('--lose'):v('--ink');x.font=font('700 60px');x.fillText(fmt(money),W-90,cy+21);
    y+=rowH;
  }
  if(lines.length){
    y+=30;x.textAlign='left';x.fillStyle=v('--ink');x.font=font('400 38px');
    lines.forEach(l=>{x.fillText(l,80,y+30);y+=lineH;});
  }
  x.textAlign='center';x.fillStyle=v('--gold');x.font=font('700 36px');x.fillText('🀄 麻將算錢',W/2,H-50);
  return c;
}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function showShare(box,canvas,filename){
  const url=canvas.toDataURL('image/png');
  box.innerHTML=`<img class="shareimg" src="${url}" alt="賽果圖片"><p class="note">長按圖片可以儲存或分享到 LINE。</p><button class="ghost" id="shareNative" hidden style="margin-top:6px">用手機分享</button>`;
  canvas.toBlob(blob=>{
    try{
      const file=new File([blob],filename,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        const b=box.querySelector('#shareNative');b.hidden=false;
        b.onclick=()=>navigator.share({files:[file],title:filename}).catch(()=>{});
      }
    }catch(e){}
  },'image/png');
}

function describe(r){
  let d;
  if(r.type==='self')d=`${pname(r.winner)} 自摸 ${r.tai} 台`;
  else if(r.type==='discard')d=`${pname(r.winner)} 胡 ${pname(r.loser)} ${r.tai} 台`;
  else if(r.type==='draw')d='流局';
  else d=r.desc||'手動輸入';
  return d+(r.edited?'（已修正）':'');
}
const TAG={self:'摸',discard:'槍',draw:'流',manual:'手'};
function histScopes(){
  const metas=roundsMeta();const opts=[];
  if(S.rounds.length)opts.push(['session',`本場（${S.rounds.length} 局）`]);
  const days={};metas.forEach(m=>{const k=dayKey(m.r.t);days[k]=(days[k]||0)+1;});
  Object.keys(days).sort().reverse().forEach(k=>opts.push(['d:'+k,`${dayLabel(k)}（${days[k]} 局）`]));
  if(metas.length)opts.push(['all',`全部（${metas.length} 局）`]);
  return opts;
}
function renderHist(){
  const opts=histScopes();
  if(!opts.length){$('hScope').innerHTML='';$('histBox').innerHTML='<p class="empty" style="margin-top:12px">還沒有紀錄。到「牌桌」點胡牌的人記下第一局。</p>';return;}
  if(!opts.some(o=>o[0]===ui.hscope))ui.hscope=opts[0][0];
  $('hScope').innerHTML=opts.map(([v,l])=>`<option value="${v}" ${v===ui.hscope?'selected':''}>${esc(l)}</option>`).join('');
  document.querySelectorAll('[data-hview]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.hview===ui.hview));
  document.querySelectorAll('[data-horder]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.horder===ui.horder));
  let metas=roundsMeta();
  if(ui.hscope==='session')metas=metas.filter(m=>m.sid==='cur');
  else if(ui.hscope.startsWith('d:')){const k=ui.hscope.slice(2);metas=metas.filter(m=>dayKey(m.r.t)===k);}
  // 欄位：出現過的玩家，依第一次出現順序
  const cols=[];metas.forEach(m=>m.r.seats.forEach(id=>{if(!cols.includes(id))cols.push(id);}));
  const tot=totals(metas.map(m=>m.r));
  let list=metas.slice();if(ui.horder==='desc')list.reverse();

  if(ui.hview==='text'){
    $('histBox').innerHTML=`<ul class="hist" style="margin-top:10px">${list.map(m=>{const r=m.r,tm=new Date(r.t);return `
      <li><div class="h1"><strong>${String(tm.getHours()).padStart(2,'0')}:${String(tm.getMinutes()).padStart(2,'0')}　${esc(describe(r))}</strong><button class="link" data-edit="${m.i}">修改</button></div>
      <div class="amts">${r.seats.map(id=>{const a=r.amounts[id]||0;return `${esc(pname(id))} <span class="${cls(a)}">${fmt(a)}</span>`;}).join('　')}</div></li>`;}).join('')}</ul>`;
    return;
  }
  const n=cols.length;
  const tmpl=`grid-template-columns:46px repeat(${n},minmax(64px,1fr))`;
  let html=`<div class="gscroll"><div class="grid" style="${tmpl}">`;
  html+=`<div class="side hd"></div>`+cols.map((id,c)=>`<div class="c hd ${c%2?'':'alt'}">${avHTML(id,'md')}<span class="nm">${esc(pname(id))}</span><span class="tot ${cls(tot[id]||0)}">${fmtPlain(tot[id]||0)}</span></div>`).join('');
  let lastPass=null;
  const passOf=m=>m.r.snap&&m.r.snap.passes!==undefined?m.r.snap.passes:null;
  list.forEach(m=>{
    const r=m.r,p=passOf(m);
    let chip='';
    if(p!==null&&p!==lastPass){chip=`<span class="wchip">${windText(p)}</span>`;lastPass=p;}
    html+=`<div class="side" data-edit="${m.i}" role="button" tabindex="0" aria-label="修改：${esc(describe(r))}"><span class="tag t-${r.type}">${TAG[r.type]||'？'}</span>${chip}</div>`;
    html+=cols.map((id,c)=>{
      const alt=c%2?'':'alt';
      if(!r.seats.includes(id))return `<div class="c ${alt} na">—</div>`;
      const a=r.amounts[id]||0;
      const isW=r.winner===id;
      return `<div class="c ${alt} ${a===0?'zero0':cls(a)} ${isW?'winc':''}">${r.dealerId===id?'<span class="dd">莊</span>':''}${fmtPlain(a)}</div>`;
    }).join('');
    if(ui.hview==='full'){const tm=new Date(r.t);html+=`<div class="ev">${String(tm.getHours()).padStart(2,'0')}:${String(tm.getMinutes()).padStart(2,'0')}　${esc(describe(r))}</div>`;}
  });
  html+='</div></div>';
  $('histBox').innerHTML=html;
}

  const n=allRounds().filter(r=>r.amounts&&r.amounts[editP]!==undefined).length;
  const msg=n?`刪掉「${p.name}」？他會從名單上消失，但 ${n} 局的舊記錄和戰績都會留著。`
            :`刪掉「${p.name}」？`;
  if(!await ask(msg,'刪除'))return;
  const keep=allRounds().some(r=>r.amounts&&r.amounts[editP]!==undefined);
  if(keep&&!S.exPlayers.some(x=>x.id===editP))S.exPlayers.push({id:p.id,name:p.name,avatar:p.avatar});
  S.players=S.players.filter(x=>x.id!==editP);
  save();$('dlgPlayer').close();renderTab();toast('已刪除');
};
$('btnAddP').onclick=()=>openPlayer(null);
$('btnPCancel').onclick=()=>$('dlgPlayer').close();
$('btnPSave').onclick=()=>{
  const n=$('pName').value.trim();
  if(!n){$('pWarn').textContent='請輸入名字。';return;}
  if(S.players.some(p=>p.name===n&&p.id!==editP)){$('pWarn').textContent='名單裡已經有這個名字。';return;}
  if(editP){const p=player(editP);p.name=n;p.avatar=draftAv;}
  else S.players.push({id:uid(),name:n,avatar:draftAv});
  save();$('dlgPlayer').close();renderTab();toast('已儲存');
};

// ---- 共用點擊 ----
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-edit]'); if(!t)return;
  const d=t.dataset;
  if(d.tab)setTab(d.tab);
  else if(d.seatTap!==undefined)openWin(+d.seatTap);
  else if(d.l!==undefined){ui.loser=d.l==='self'?'self':+d.l;ui.override={};renderWin();}
  else if(d.q){ui.tai=+d.q;ui.override={};renderWin();}
  else if(d.range){ui.range=d.range;
    if(d.range==='custom'&&!ui.from){ui.to=dayKey(Date.now());ui.from=dayKey(Date.now()-6*DAY);$('rFrom').value=ui.from;$('rTo').value=ui.to;}
    renderStats();}
  else if(d.sp){ui.statP=d.sp;if(ui.tab==='statd'){renderStatDetail();}else setTab('statd');}
  else if(d.hview){ui.hview=d.hview;renderHist();}
  else if(d.horder){ui.horder=d.horder;renderHist();}
  else if(d.edit!==undefined)openEdit(+d.edit);
  else if(d.pedit)openPlayer(d.pedit);
  else if(d.emoji){draftAv=d.emoji;renderPDlg();}
  else if(d.themeSet){S.theme=d.themeSet;applyTheme();markTheme();save();}
});
$('hScope').onchange=e=>{ui.hscope=e.target.value;renderHist();};
$('btnStatBack').onclick=()=>setTab('stats');
$('btnYear').onclick=()=>setTab('year');
$('btnYearBack').onclick=()=>setTab('stats');
$('yearSel').onchange=e=>{ui.year=+e.target.value;renderYear();};
$('jSeats').onclick=()=>{$('dlgJiang').close();$('tbSeats').click();};
$('jSettle').onclick=()=>{$('dlgJiang').close();openSettle();};
$('jGo').onclick=()=>$('dlgJiang').close();
$('rFrom').onchange=e=>{ui.from=e.target.value;renderStats();};
$('rTo').onchange=e=>{ui.to=e.target.value;renderStats();};

applyTheme();save();setTab('table');
</script>

<script type="module">
/* ══════════════════════════════════════════════════════════
   雲端同步層
   不改動原本的計分邏輯，只做三件事：
     1. 接管 save()，本機存檔後順便上傳
     2. 收到別台的更新就套用並重繪
     3. 帳號登入 / 開桌代碼 / 管理員
   ══════════════════════════════════════════════════════════ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup,
  createUserWithEmailAndPassword, signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
  arrayUnion, arrayRemove, serverTimestamp, collection, getDocs, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJnuuQ1APxpb5aSFVE8ZsX9FDsOmQ0u8M",
  authDomain: "piaoyang-mahjong.firebaseapp.com",
  projectId: "piaoyang-mahjong",
  storageBucket: "piaoyang-mahjong.firebasestorage.app",
  messagingSenderId: "1048210082182",
  appId: "1:1048210082182:web:fa008cf788bfcc57a04407"
};
const ADMIN_EMAIL = "ooproviceoo@gmail.com";
const LS_CODE = "mj_cloud_code";
const LS_BACKUP = "mahjong-money-v2-backup";
const STORE_KEY = "mahjong-money-v2";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const g  = id => document.getElementById(id);
const eh = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let me = null, code = null, unsub = null, timer = null;
let applying = false, lastSent = null, tableMeta = {};
let authMode = "login";

const isAdmin = () => me && me.email === ADMIN_EMAIL;

async function sha256(str){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
function makeCode(){
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // 去掉 I O 0 1，避免抄錯
  return Array.from({length:6}, () => abc[Math.floor(Math.random()*abc.length)]).join("");
}
function errText(e){
  const m = {
    "auth/invalid-email":"電子郵件格式不對",
    "auth/missing-password":"請輸入密碼",
    "auth/weak-password":"密碼至少要 6 個字",
    "auth/email-already-in-use":"這個信箱註冊過了，請改用登入",
    "auth/invalid-credential":"帳號或密碼不對",
    "auth/user-not-found":"找不到這個帳號",
    "auth/wrong-password":"密碼不對",
    "auth/popup-closed-by-user":"登入視窗被關掉了",
    "auth/popup-blocked":"登入視窗被瀏覽器擋住，請允許彈出視窗",
    "auth/unauthorized-domain":"這個網域還沒加進 Firebase 的授權網域",
    "permission-denied":"沒有權限，請確認代碼和密碼"
  };
  return m[e && e.code] || (e && e.message) || String(e);
}

/* ── 狀態轉換 ───────────────────────────────────── */
function snapshotState(){
  const o = {};
  for(const k in S) if(k !== "theme") o[k] = S[k];
  return o;
}
function applyState(obj){
  applying = true;
  for(const k of Object.keys(S)) if(k !== "theme") delete S[k];
  for(const k in obj) if(k !== "theme") S[k] = obj[k];
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
  applying = false;
  try{ renderTab(); }catch(e){ console.warn(e); }
}

/* ── 接管 save() ────────────────────────────────── */
const origSave = window.save;
window.save = function(){
  const r = origSave.apply(this, arguments);
  if(code && me && !applying) schedulePush();
  return r;
};
function schedulePush(){
  clearTimeout(timer);
  timer = setTimeout(push, 700);
}
// 歸零之類的重大變更：不等 debounce，立刻覆蓋雲端
addEventListener("mj-force-push", () => { clearTimeout(timer); push(); });
async function push(){
  if(!code || !me) return;
  try{
    const json = JSON.stringify(snapshotState());
    if(json === lastSent) return;
    lastSent = json;
    await updateDoc(doc(db,"tables",code), {
      data: json, by: me.uid, updatedAt: serverTimestamp()
    });
  }catch(e){ toast("上傳失敗：" + errText(e)); }
}

/* ── 監聽 ───────────────────────────────────────── */
function listen(c){
  if(unsub) unsub();
  unsub = onSnapshot(doc(db,"tables",c),
    snap => {
      if(!snap.exists()){
        toast("這一桌已經被刪除了");
        stopListen(); return;
      }
      if(snap.metadata.hasPendingWrites) return;   // 自己剛送出的，不用套回來
      const d = snap.data();
      code = c; tableMeta = d;
      localStorage.setItem(LS_CODE, c);
      if(d.data && d.data !== lastSent){
        lastSent = d.data;
        try{ applyState(JSON.parse(d.data)); }catch(e){ console.warn(e); }
      }
      paintBtn();
      if(g("dlgCloud").open) renderCloud();
    },
    err => {
      console.warn(err);
      if(err.code === "permission-denied"){ stopListen(); toast("已離開這一桌"); }
    });
}
function stopListen(){
  if(unsub) unsub();
  unsub = null; code = null; tableMeta = {}; lastSent = null;
  localStorage.removeItem(LS_CODE);
  paintBtn();
  if(g("dlgCloud").open) renderCloud();
}

/* ── 按鈕外觀 ───────────────────────────────────── */
function paintBtn(){
  const b = g("tbCloud");
  if(!b) return;
  const on = !!(code && me);
  b.classList.toggle("cloudon", on);
  b.lastChild.textContent = on ? code : "雲端";
}

/* ── 對話框 ─────────────────────────────────────── */
g("tbCloud").onclick = () => { renderCloud(); g("dlgCloud").showModal(); };

function renderCloud(){
  const box = g("cloudBody");
  if(!me)            box.innerHTML = viewAuth();
  else if(code)      box.innerHTML = viewTable();
  else               box.innerHTML = viewLobby();
  wire();
}

function viewAuth(){
  return `
    <h2>☁ 雲端同步</h2>
    <p class="note" style="margin-top:0">登入後資料會存到雲端，換手機也找得回來。也可以開一桌讓別人用代碼加入，一起看同一桌分數。</p>
    <button class="primary" id="cGoogle">用 Google 帳號登入</button>
    <div class="label" style="text-align:center">或用電子郵件</div>
    <div class="seg two" style="margin-bottom:6px">
      <button id="cTabLogin" aria-pressed="${authMode==="login"}">登入</button>
      <button id="cTabReg" aria-pressed="${authMode==="reg"}">註冊</button>
    </div>
    <div class="field"><label for="cEmail">電子郵件</label><input type="text" id="cEmail" autocomplete="email"></div>
    <div class="field"><label for="cPass">密碼</label><input type="password" id="cPass" autocomplete="current-password"></div>
    <p class="warn" id="cErr"></p>
    <div class="row between" style="margin-top:12px">
      <button class="ghost" id="cClose">關閉</button>
      <button class="primary small" id="cAuth">${authMode==="reg"?"註冊":"登入"}</button>
    </div>`;
}

function viewLobby(){
  const hasBackup = !!localStorage.getItem(LS_BACKUP);
  return `
    <h2>☁ 雲端同步</h2>
    <p class="note" style="margin-top:0">已登入：${eh(me.displayName || me.email)}</p>

    <div class="label">開一桌給別人加入</div>
    <p class="note" style="margin-top:0">會把這台手機目前的牌局上傳，並產生一組代碼。</p>
    <div class="field"><label for="cNewPwd">牌桌密碼（至少 4 個字）</label><input type="text" id="cNewPwd" autocomplete="off"></div>
    <button class="primary" id="cCreate">建立牌桌</button>

    <div class="label" style="margin-top:18px">加入別人的桌</div>
    <div class="field"><label for="cJoinCode">代碼</label><input type="text" id="cJoinCode" autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em"></div>
    <div class="field"><label for="cJoinPwd">密碼</label><input type="text" id="cJoinPwd" autocomplete="off"></div>
    <p class="warn" style="font-weight:400">加入後這台手機目前的牌局會被雲端資料取代，原本的會先備份起來。</p>
    <button class="ghost" id="cJoin" style="width:100%;padding:12px">加入</button>
    <p class="warn" id="cErr"></p>

    ${hasBackup ? `<div class="label" style="margin-top:18px">本機備份</div>
      <button class="ghost" id="cRestore" style="width:100%;padding:12px">還原加入雲端前的牌局</button>` : ""}

    <div class="row between" style="margin-top:18px">
      <button class="link" id="cSignOut">登出</button>
      <button class="primary small" id="cClose">關閉</button>
    </div>`;
}

function viewTable(){
  const n = (tableMeta.members || []).length;
  const owner = tableMeta.owner === (me && me.uid);
  return `
    <h2>☁ 已連線</h2>
    <p class="note" style="margin-top:0">任何一台記一局，其他人的畫面都會跟著更新。</p>
    <div class="cloudcode">${eh(code)}</div>
    <p class="note" style="margin-top:0;text-align:center">目前 ${n} 台裝置在這一桌${owner ? "　·　你是開桌的人" : ""}</p>
    <button class="primary" id="cCopy">複製代碼</button>

    <div class="label" style="margin-top:18px">離開</div>
    <button class="ghost" id="cLeave" style="width:100%;padding:12px">離線使用（資料留在雲端）</button>
    ${owner || isAdmin() ? `<button class="ghost" id="cDelete" style="width:100%;padding:12px;margin-top:8px;border-color:var(--lose);color:var(--lose)">刪除這一桌</button>` : ""}

    ${isAdmin() ? `<div class="label" style="margin-top:18px">管理員</div>
      <button class="ghost" id="cAdmin" style="width:100%;padding:12px">列出所有牌桌</button>
      <ul class="cloudlist" id="cAdminList"></ul>` : ""}

    <div class="row between" style="margin-top:18px">
      <button class="link" id="cSignOut">登出</button>
      <button class="primary small" id="cClose">關閉</button>
    </div>`;
}

/* ── 事件綁定 ───────────────────────────────────── */
function wire(){
  const on = (id, fn) => { const b = g(id); if(b) b.onclick = fn; };
  const err = t => { const e = g("cErr"); if(e) e.textContent = t; };

  on("cClose", () => g("dlgCloud").close());
  on("cTabLogin", () => { authMode="login"; renderCloud(); });
  on("cTabReg",   () => { authMode="reg";   renderCloud(); });

  on("cGoogle", async () => {
    err("");
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ err(errText(e)); }
  });
  on("cAuth", async () => {
    err("");
    const email = g("cEmail").value.trim(), pass = g("cPass").value;
    try{
      if(authMode === "reg") await createUserWithEmailAndPassword(auth, email, pass);
      else                   await signInWithEmailAndPassword(auth, email, pass);
    }catch(e){ err(errText(e)); }
  });
  on("cSignOut", async () => {
    stopListen();
    await signOut(auth);
    renderCloud();
  });

  on("cCreate", async () => {
    err("");
    const pwd = g("cNewPwd").value.trim();
    if(pwd.length < 4) return err("密碼至少 4 個字");
    const c = makeCode();
    try{
      const proof = await sha256(c + "::" + pwd);
      const json  = JSON.stringify(snapshotState());
      await setDoc(doc(db,"tickets",proof), { code:c, createdAt: serverTimestamp() });
      await setDoc(doc(db,"tables",c), {
        owner: me.uid, members:[me.uid], proof,
        data: json, by: me.uid,
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
      lastSent = json;
      listen(c);
      toast("牌桌建好了：" + c);
      renderCloud();
    }catch(e){ err(errText(e)); }
  });

  on("cJoin", async () => {
    err("");
    const c   = g("cJoinCode").value.trim().toUpperCase();
    const pwd = g("cJoinPwd").value.trim();
    if(c.length !== 6) return err("代碼是 6 個字");
    if(!pwd)           return err("請輸入密碼");
    try{
      const proof = await sha256(c + "::" + pwd);
      const t = await getDoc(doc(db,"tickets",proof));
      if(!t.exists() || t.data().code !== c) return err("代碼或密碼不對");
      try{ localStorage.setItem(LS_BACKUP, JSON.stringify(S)); }catch(e){}
      await updateDoc(doc(db,"tables",c), { members: arrayUnion(me.uid), proof });
      lastSent = null;
      listen(c);
      toast("已加入 " + c);
      renderCloud();
    }catch(e){ err(errText(e)); }
  });

  on("cRestore", async () => {
    if(!await ask("還原加入雲端前的牌局？目前畫面上的資料會被取代。","還原")) return;
    try{
      const b = JSON.parse(localStorage.getItem(LS_BACKUP));
      if(b && b.players){ applyState(b); toast("已還原"); g("dlgCloud").close(); }
    }catch(e){ toast("備份讀不到"); }
  });

  on("cCopy", async () => {
    try{ await navigator.clipboard.writeText(code); toast("代碼已複製"); }
    catch(e){ toast("請手動抄下代碼"); }
  });

  on("cLeave", async () => {
    if(!await ask("離線使用？資料會留在雲端，之後用同樣的代碼和密碼還能加回來。","離線")) return;
    const c = code, uid = me.uid;
    stopListen();
    try{ await updateDoc(doc(db,"tables",c), { members: arrayRemove(uid) }); }catch(e){}
    renderCloud();
  });

  on("cDelete", async () => {
    if(!await ask("刪除這一桌？雲端的記錄會全部消失，沒辦法救回來。本機資料會留著。","刪除")) return;
    const c = code;
    stopListen();
    try{ await deleteDoc(doc(db,"tables",c)); toast("已刪除"); }
    catch(e){ toast(errText(e)); }
    renderCloud();
  });

  on("cAdmin", async () => {
    const ul = g("cAdminList");
    ul.innerHTML = "<li>載入中…</li>";
    try{
      const snap = await getDocs(query(collection(db,"tables"), orderBy("createdAt","desc"), limit(50)));
      ul.innerHTML = "";
      if(snap.empty){ ul.innerHTML = "<li>目前沒有牌桌</li>"; return; }
      snap.forEach(d => {
        let n = 0;
        try{ n = (JSON.parse(d.data().data || "{}").rounds || []).length; }catch(e){}
        const li = document.createElement("li");
        li.innerHTML = `<span class="c">${eh(d.id)}</span><span class="g">${n} 局</span>`;
        const b = document.createElement("button");
        b.className = "ghost"; b.textContent = "打開";
        b.onclick = () => { lastSent = null; listen(d.id); toast("已打開 " + d.id); renderCloud(); };
        li.appendChild(b);
        ul.appendChild(li);
      });
    }catch(e){ ul.innerHTML = "<li>" + eh(errText(e)) + "</li>"; }
  });
}

/* ── 啟動 ───────────────────────────────────────── */
onAuthStateChanged(auth, async user => {
  me = user;
  if(!user){ stopListen(); paintBtn(); if(g("dlgCloud").open) renderCloud(); return; }
  const last = localStorage.getItem(LS_CODE);
  if(last) listen(last);
  paintBtn();
  if(g("dlgCloud").open) renderCloud();
});
paintBtn();
</script>

<script>
if("serviceWorker" in navigator){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
